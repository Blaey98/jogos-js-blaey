    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* Previne fullscreen */
        html, body {
            position: relative !important;
            overflow: auto !important;
        }

        /* Força o jogo a ficar no container */
        * {
            max-width: 100% !important;
        }

        .container {
            max-width: 100%;
            margin: 0;
            padding: 10px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            color: white;
            padding: 0 10px;
        }

        .header h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1rem;
            opacity: 0.9;
        }

        /* BANNER 320x100 - Banner real com link */
        .banner-ad {
            width: 100%;
            max-width: 320px;
            height: 100px;
            margin: 10px auto 20px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            position: relative;
            min-height: 100px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .banner-ad:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .banner-ad a {
            display: block;
            width: 100%;
            height: 100%;
            text-decoration: none;
        }

        .banner-ad img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 6px;
        }

        /* Container do jogo */
        .game-container {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 10px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .game-iframe {
            width: 100%;
            height: 600px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #4ecdc4 0%, #2ecc71 100%);
            overflow: hidden;
            position: relative;
        }

        .game-iframe iframe {
            width: 100% !important;
            height: 100% !important;
            border: none !important;
            border-radius: 10px !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            z-index: 1 !important;
        }

        .loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 600px;
            background: linear-gradient(135deg, #4ecdc4 0%, #2ecc71 100%);
            border-radius: 10px;
            color: white;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .loading-subtext {
            font-size: 0.9rem;
            opacity: 0.8;
        }


        .back-button {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            font-size: 0.9rem;
            z-index: 1000;
        }

        .back-button:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.05);
        }

        /* Desktop styles */
        @media (min-width: 768px) {
            .container {
                max-width: 1200px;
                margin: 0 auto;
                padding: 20px;
            }
            
            .banner-ad {
                max-width: 400px;
            }
            
            .game-container {
                max-width: 500px;
            }
            
            .game-iframe {
                height: 700px;
            }
            
            .loading-screen {
                height: 700px;
            }
            
            .header h1 {
                font-size: 2.5rem;
            }
            
            .header p {
                font-size: 1.1rem;
            }
        }
    </style>
</head>

    <script src="js/game-config.js"></script>
    <script src="js/games-config.js"></script>
    <script>
        function loadDefaultGame() {
            // Carrega o jogo Table Tennis Shots por padrão
            const gameUrl = 'https://10944.play.gamezop.com/g/HJY4pfJP9JQ';
            const gameFrame = document.getElementById('gameFrame');
            const loadingScreen = document.getElementById('loadingScreen');
            
            // Simula carregamento
            setTimeout(function() {
                loadingScreen.style.display = 'none';
                
                // Cria iframe com parâmetros que previnem fullscreen
                const iframe = document.createElement('iframe');
                iframe.src = gameUrl;
                iframe.style.cssText = 'width: 100%; height: 100%; border: none; border-radius: 10px;';
                iframe.setAttribute('frameborder', '0');
                iframe.setAttribute('scrolling', 'no');
                iframe.setAttribute('allow', 'autoplay');
                iframe.setAttribute('allowfullscreen', 'false');
                iframe.setAttribute('webkitallowfullscreen', 'false');
                iframe.setAttribute('mozallowfullscreen', 'false');
                iframe.setAttribute('msallowfullscreen', 'false');
                
                gameFrame.appendChild(iframe);
                gameFrame.style.display = 'block';
                
                // Previne fullscreen via JavaScript
                iframe.addEventListener('load', function() {
                    try {
                        iframe.contentWindow.addEventListener('keydown', function(e) {
                            if (e.key === 'F11') {
                                e.preventDefault();
                                return false;
                            }
                        });
                    } catch(e) {
                        console.log('Não foi possível acessar o conteúdo do iframe');
                    }
                });
                
            }, 2000);
        }

        function goBack() {
            window.location.href = 'index.html';
        }

        // Previne fullscreen em toda a página
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F11') {
                e.preventDefault();
                return false;
            }
        });

        // Previne fullscreen via API
        document.addEventListener('fullscreenchange', function() {
            if (document.fullscreenElement) {
                document.exitFullscreen();
            }
        });

        // Carrega o jogo quando a página é carregada
        document.addEventListener('DOMContentLoaded', loadDefaultGame);
    </script>
