<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Pac Social</title>
    <link rel="shortcut icon" href="favicon.png">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7154773731438541"
     crossorigin="anonymous"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .banner-container {
            width: 100%;
            height: 100px;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 5px;
            flex-shrink: 0;
        }
        
        .banner-ad {
            width: 320px;
            height: 100px;
            display: block;
        }
        
        .game-container {
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            overflow: hidden;
        }
        
        #canvas {
            max-width: 100%;
            max-height: 100%;
            width: auto !important;
            height: auto !important;
        }
        
        /* Landscape orientation - adjust banner height */
        @media (orientation: landscape) and (max-height: 500px) {
            .banner-container {
                height: 60px;
                padding: 2px 0;
            }
        }
        
        /* High DPI displays */
        @media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
            #canvas {
                image-rendering: -webkit-optimize-contrast;
                image-rendering: crisp-edges;
            }
        }
        

        

        

        
        
        
        
        
        
        
    </style>
    </head>
<body>
    <div class="banner-container">
        <div class="banner-ad">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-7154773731438541"
                 data-ad-slot="8720222025"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
            <script>
                 (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>
    </div>
    
    <div class="game-container">
        <canvas id="canvas" width="960" height="640">Jogo não suportado</canvas>
    </div>

    <script src="./static/script/game.js"></script>
    <script src="./static/script/index.js"></script>
    <script src="./static/script/mobile-gestures.js"></script>
    <script src="./static/script/virtual-controls.js"></script>
    
    <script>
        // Canvas fit with banner
        function adjustCanvasForMobile() {
            const canvas = document.getElementById('canvas');
            if (!canvas) return;
            
            const screenWidth = window.innerWidth;
            const bannerHeight = 100;
            const availableHeight = window.innerHeight - bannerHeight;
            
            const originalWidth = 960;
            const originalHeight = 640;
            
            const scale = Math.min(screenWidth / originalWidth, availableHeight / originalHeight) * 0.95;
            
            canvas.width = originalWidth * scale;
            canvas.height = originalHeight * scale;
        }
        
        // Mobile controls with advanced gesture support
        document.addEventListener('DOMContentLoaded', function() {
            const canvas = document.getElementById('canvas');
            
            // Adjust canvas for mobile first
            adjustCanvasForMobile();
            
            // Re-adjust after game initializes (to override game.js canvas resizing)
            setTimeout(function() {
                adjustCanvasForMobile();
            }, 200);
            
            // Re-adjust after a bit more time to ensure game loaded
            setTimeout(function() {
                adjustCanvasForMobile();
            }, 500);
            
            // Re-adjust on resize
            let resizeTimeout;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(adjustCanvasForMobile, 100);
            });
            
            // Re-adjust on orientation change
            window.addEventListener('orientationchange', function() {
                setTimeout(adjustCanvasForMobile, 200);
            });
            
            // Watch for canvas size changes and reapply responsive size
            const observer = new MutationObserver(function(mutations) {
                adjustCanvasForMobile();
            });
            
            // Observe canvas for attribute changes
            observer.observe(canvas, { 
                attributes: true, 
                attributeFilter: ['width', 'height', 'style']
            });
            
            // Periodically check and reapply responsive size
            setInterval(function() {
                const currentWidth = canvas.getAttribute('width');
                const currentHeight = canvas.getAttribute('height');
                if (currentWidth == 960 || currentHeight == 640) {
                    // Game.js reset the size, reapply responsive
                    adjustCanvasForMobile();
                }
            }, 500);
            
            // Initialize mobile gestures
            const gestures = new MobileGestures(canvas, {
                minSwipeDistance: 25,
                maxSwipeTime: 400,
                doubleTapDelay: 300,
                longPressDelay: 600
            });
            
            // Initialize virtual controls responsivos
            function getResponsiveControlSize() {
                const screenWidth = window.innerWidth;
                const screenHeight = window.innerHeight;
                const isLandscape = screenWidth > screenHeight;
                
                // Tamanho base responsivo
                let baseSize = 60;
                let basePadding = 15;
                
                if (screenWidth <= 375) {
                    // Celulares pequenos
                    baseSize = 50;
                    basePadding = 12;
                } else if (screenWidth <= 480) {
                    // Celulares médios
                    baseSize = 60;
                    basePadding = 15;
                } else if (screenWidth <= 768) {
                    // Celulares grandes
                    baseSize = 70;
                    basePadding = 18;
                } else if (screenWidth <= 1024) {
                    // Tablets
                    baseSize = 80;
                    basePadding = 20;
                } else {
                    // Desktop
                    baseSize = 90;
                    basePadding = 25;
                }
                
                // Ajuste para landscape
                if (isLandscape) {
                    baseSize *= 0.8;
                    basePadding *= 0.8;
                }
                
                return { size: baseSize, padding: basePadding };
            }
            
            const controlConfig = getResponsiveControlSize();
            const virtualControls = new VirtualControls(canvas, {
                size: controlConfig.size,
                padding: controlConfig.padding,
                opacity: 0.8,
                showLabels: true
            });
            
            // Gesture callbacks with enhanced debugging
            gestures.onSwipe(function(data) {
                console.log('🎮 SWIPE DETECTED:', data.direction, 'Distance:', Math.round(data.distance), 'Duration:', data.duration + 'ms');
                console.log('🎮 Sending key press for direction:', data.direction);
                simulateKeyPress(data.direction);
            });
            
            gestures.onTap(function(data) {
                console.log('🎮 TAP DETECTED at:', Math.round(data.x), Math.round(data.y));
                
                // Verificar se estamos na tela de game over
                if (window.game && window.game.getCurrentStage) {
                    const currentStage = window.game.getCurrentStage();
                    console.log('🎮 Current stage:', currentStage);
                    
                    // Se estivermos no stage 1 (Game Over), reiniciar o jogo
                    if (currentStage === 1) {
                        console.log('🎮 Game Over detected - Restarting game on tap');
                        
                        // Resetar todas as variáveis globais do jogo
                        if (typeof _SCORE !== 'undefined') _SCORE = 0;
                        if (typeof _LIFE !== 'undefined') _LIFE = 5;
                        
                        // Resetar nível atual
                        if (typeof window.currentLevelIndex !== 'undefined') {
                            window.currentLevelIndex = 0;
                        }
                        
                        // Limpar qualquer estado de jogo
                        if (window.game && window.game.reset) {
                            window.game.reset();
                        }
                        
                        // Voltar para o primeiro stage (jogo principal)
                        window.game.setStage(0);
                        console.log('🎮 Game restarted - Score:', _SCORE, 'Lives:', _LIFE, 'Level:', window.currentLevelIndex + 1);
                        
                        // Adicionar feedback visual
                        addTouchFeedback();
                        return;
                    }
                }
                
                console.log('🎮 Sending space key for pause/unpause');
                simulateKeyPress('space');
            });
            
            gestures.onDoubleTap(function(data) {
                console.log('Double tap detected');
                // Restart game on double tap
                if (window.game && window.game.getStages) {
                    const stages = window.game.getStages();
                    if (stages.length > 0) {
                        window.game.setStage(0);
                    }
                }
            });
            
            gestures.onLongPress(function(data) {
                console.log('Long press detected');
                // Show menu or special action
                virtualControls.toggle();
            });
            
            // Virtual controls callbacks
            virtualControls.onDirection(function(direction) {
                console.log('Virtual direction:', direction);
                simulateKeyPress(direction);
            });
            
            virtualControls.onAction(function(action) {
                console.log('Virtual action:', action);
                simulateKeyPress(action);
            });
            
            // Adicionar métodos show/hide aos controles virtuais
            if (window.virtualControls) {
                window.virtualControls.show = function() {
                    this.isVisible = true;
                    console.log('🎮 Virtual controls shown');
                };
                
                window.virtualControls.hide = function() {
                    this.isVisible = false;
                    console.log('🎮 Virtual controls hidden');
                };
            }
            
            // Prevent scrolling and context menu
            document.addEventListener('touchmove', function(e) {
                e.preventDefault();
            }, { passive: false });
            
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
            });
            
            // Adicionar listener direto para tap na tela de game over
            canvas.addEventListener('touchstart', function(e) {
                e.preventDefault();
                console.log('🎮 Touch detected on canvas');
                
                // Verificar se estamos na tela de game over
                if (window.game && window.game.getCurrentStage) {
                    const currentStage = window.game.getCurrentStage();
                    console.log('🎮 Current stage on touch:', currentStage);
                    
                    if (currentStage === 1) {
                        console.log('🎮 Game Over - Touch detected, restarting game');
                        
                        // Resetar todas as variáveis globais do jogo
                        if (typeof _SCORE !== 'undefined') _SCORE = 0;
                        if (typeof _LIFE !== 'undefined') _LIFE = 5;
                        
                        // Resetar nível atual
                        if (typeof window.currentLevelIndex !== 'undefined') {
                            window.currentLevelIndex = 0;
                        }
                        
                        // Limpar qualquer estado de jogo
                        if (window.game && window.game.reset) {
                            window.game.reset();
                        }
                        
                        // Voltar para o primeiro stage (jogo principal)
                        window.game.setStage(0);
                        console.log('🎮 Game restarted via touch - Score:', _SCORE, 'Lives:', _LIFE, 'Level:', window.currentLevelIndex + 1);
                        
                        // Adicionar feedback visual
                        addTouchFeedback();
                        return;
                    }
                } else {
                    console.log('🎮 Game object not available or getCurrentStage not found');
                }
            }, { passive: false });
            
            // Também adicionar para mouse clicks (desktop)
            canvas.addEventListener('click', function(e) {
                console.log('🎮 Click detected on canvas');
                
                // Verificar se estamos na tela de game over
                if (window.game && window.game.getCurrentStage) {
                    const currentStage = window.game.getCurrentStage();
                    console.log('🎮 Current stage on click:', currentStage);
                    
                    if (currentStage === 1) {
                        console.log('🎮 Game Over - Click detected, restarting game');
                        
                        // Resetar todas as variáveis globais do jogo
                        if (typeof _SCORE !== 'undefined') _SCORE = 0;
                        if (typeof _LIFE !== 'undefined') _LIFE = 5;
                        
                        // Resetar nível atual
                        if (typeof window.currentLevelIndex !== 'undefined') {
                            window.currentLevelIndex = 0;
                        }
                        
                        // Limpar qualquer estado de jogo
                        if (window.game && window.game.reset) {
                            window.game.reset();
                        }
                        
                        // Voltar para o primeiro stage (jogo principal)
                        window.game.setStage(0);
                        console.log('🎮 Game restarted via click - Score:', _SCORE, 'Lives:', _LIFE, 'Level:', window.currentLevelIndex + 1);
                        
                        // Adicionar feedback visual
                        addTouchFeedback();
                        return;
                    }
                } else {
                    console.log('🎮 Game object not available or getCurrentStage not found');
                }
            });
            
            // Keyboard support for desktop
            document.addEventListener('keydown', function(e) {
                // Verificar se estamos na tela de game over
                if (window.game && window.game.getCurrentStage) {
                    const currentStage = window.game.getCurrentStage();
                    
                    if (currentStage === 1) {
                        // Qualquer tecla na tela de game over reinicia o jogo
                        console.log('🎮 Game Over - Key pressed, restarting game');
                        
                        // Resetar todas as variáveis globais do jogo
                        if (typeof _SCORE !== 'undefined') _SCORE = 0;
                        if (typeof _LIFE !== 'undefined') _LIFE = 5;
                        
                        // Resetar nível atual
                        if (typeof window.currentLevelIndex !== 'undefined') {
                            window.currentLevelIndex = 0;
                        }
                        
                        // Limpar qualquer estado de jogo
                        if (window.game && window.game.reset) {
                            window.game.reset();
                        }
                        
                        // Voltar para o primeiro stage (jogo principal)
                        window.game.setStage(0);
                        console.log('🎮 Game restarted via keyboard - Score:', _SCORE, 'Lives:', _LIFE, 'Level:', window.currentLevelIndex + 1);
                        
                        e.preventDefault();
                        return;
                    }
                }
                
                if (e.code === 'Space') {
                    e.preventDefault();
                    simulateKeyPress('space');
                }
            });
            
            function simulateKeyPress(key) {
                console.log('🎮 SIMULATING KEY PRESS:', key);
                let keyCode;
                switch(key) {
                    case 'up': keyCode = 38; break;
                    case 'down': keyCode = 40; break;
                    case 'left': keyCode = 37; break;
                    case 'right': keyCode = 39; break;
                    case 'space': keyCode = 32; break;
                }
                
                if (keyCode) {
                    console.log('🎮 Creating keyboard event with keyCode:', keyCode);
                    
                    // Criar evento de teclado com todas as propriedades necessárias
                    const event = new KeyboardEvent('keydown', {
                        keyCode: keyCode,
                        which: keyCode,
                        key: key === 'space' ? ' ' : key,
                        code: key === 'space' ? 'Space' : 'Arrow' + key.charAt(0).toUpperCase() + key.slice(1),
                        bubbles: true,
                        cancelable: true,
                        charCode: 0,
                        detail: 0,
                        location: 0,
                        repeat: false
                    });
                    
                    console.log('🎮 Dispatching keyboard event to window:', event);
                    // Enviar para window (onde o jogo está escutando)
                    window.dispatchEvent(event);
                    
                    // Também tentar enviar para document
                    document.dispatchEvent(event);
                    
                    console.log('🎮 Keyboard event dispatched successfully');
                } else {
                    console.log('🎮 No keyCode found for:', key);
                }
            }
            
            // Funções removidas - lógica simplificada implementada diretamente nos métodos
            
            // Enhanced mobile detection
            function isMobileDevice() {
                const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ||
                                (navigator.maxTouchPoints && navigator.maxTouchPoints > 1) ||
                                ('ontouchstart' in window) ||
                                (window.innerWidth <= 768);
                console.log('🎮 Mobile detection:', {
                    userAgent: navigator.userAgent,
                    maxTouchPoints: navigator.maxTouchPoints,
                    ontouchstart: 'ontouchstart' in window,
                    windowWidth: window.innerWidth,
                    isMobile: isMobile
                });
                return isMobile;
            }
            
            // Hide virtual controls completely for clean screen
            virtualControls.hide();
            console.log('🎮 Virtual controls hidden for clean screen');
            
            // Orientation change handling
            window.addEventListener('orientationchange', function() {
                setTimeout(function() {
                    resizeCanvas();
                    // Redimensionar controles virtuais
                    const newConfig = getResponsiveControlSize();
                    virtualControls.size = newConfig.size;
                    virtualControls.padding = newConfig.padding;
                    virtualControls.createDPad();
                    virtualControls.createActionButtons();
                }, 100);
            });
            
            // Resize handling para mudanças de tamanho de tela
            window.addEventListener('resize', function() {
                setTimeout(function() {
                    resizeCanvas();
                    // Redimensionar controles virtuais
                    const newConfig = getResponsiveControlSize();
                    virtualControls.size = newConfig.size;
                    virtualControls.padding = newConfig.padding;
                    virtualControls.createDPad();
                    virtualControls.createActionButtons();
                }, 100);
            });
            
            // Enhanced touch feedback
            function addTouchFeedback() {
                const feedback = document.createElement('div');
                feedback.style.cssText = `
                    position: fixed;
                    width: 20px;
                    height: 20px;
                    background: rgba(255, 255, 255, 0.8);
                    border-radius: 50%;
                    pointer-events: none;
                    z-index: 9999;
                    transform: translate(-50%, -50%);
                    animation: touchFeedback 0.3s ease-out;
                `;
                
                document.body.appendChild(feedback);
                
                setTimeout(() => {
                    document.body.removeChild(feedback);
                }, 300);
            }
            
            // Add CSS for touch feedback animation
            const style = document.createElement('style');
            style.textContent = `
                @keyframes touchFeedback {
                    0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
                    100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
                }
            `;
            document.head.appendChild(style);
            
            // Add touch feedback to gestures
            gestures.onTap(function(data) {
                addTouchFeedback();
            });
            
            gestures.onSwipe(function(data) {
                addTouchFeedback();
            });
            
            // Expose controls globally for game integration
            window.gestures = gestures;
            window.virtualControls = virtualControls;
            
            // Função para reiniciar o jogo
            function restartGame() {
                console.log('🎮 Restarting game...');
                
                // Resetar todas as variáveis globais do jogo
                if (typeof _SCORE !== 'undefined') _SCORE = 0;
                if (typeof _LIFE !== 'undefined') _LIFE = 5;
                
                // Resetar nível atual
                if (typeof window.currentLevelIndex !== 'undefined') {
                    window.currentLevelIndex = 0;
                }
                
                // Limpar qualquer estado de jogo
                if (window.game && window.game.reset) {
                    window.game.reset();
                }
                
                // Voltar para o primeiro stage (jogo principal)
                window.game.setStage(0);
                console.log('🎮 Game restarted - Score:', _SCORE, 'Lives:', _LIFE, 'Level:', window.currentLevelIndex + 1);
                
                // Adicionar feedback visual
                addTouchFeedback();
            }
            
            // Listener global para toda a tela na game over - TOUCH
            document.addEventListener('touchstart', function(e) {
                console.log('🎮 Global touchstart detected');
                if (window.game && window.game.getCurrentStage) {
                    const currentStage = window.game.getCurrentStage();
                    console.log('🎮 Current stage on global touch:', currentStage);
                    if (currentStage === 1) {
                        console.log('🎮 Game Over - Global touch detected, restarting game');
                        e.preventDefault();
                        e.stopPropagation();
                        restartGame();
                        return false;
                    }
                }
            }, { passive: false });
            
            // Listener global para mouse em toda a tela - CLICK
            document.addEventListener('click', function(e) {
                console.log('🎮 Global click detected');
                if (window.game && window.game.getCurrentStage) {
                    const currentStage = window.game.getCurrentStage();
                    console.log('🎮 Current stage on global click:', currentStage);
                    if (currentStage === 1) {
                        console.log('🎮 Game Over - Global click detected, restarting game');
                        e.preventDefault();
                        e.stopPropagation();
                        restartGame();
                        return false;
                    }
                }
            });
            
            // Listener adicional para touchend
            document.addEventListener('touchend', function(e) {
                console.log('🎮 Global touchend detected');
                if (window.game && window.game.getCurrentStage) {
                    const currentStage = window.game.getCurrentStage();
                    console.log('🎮 Current stage on global touchend:', currentStage);
                    if (currentStage === 1) {
                        console.log('🎮 Game Over - Global touchend detected, restarting game');
                        e.preventDefault();
                        e.stopPropagation();
                        restartGame();
                        return false;
                    }
                }
            }, { passive: false });
            
            // Listener específico para o body
            document.body.addEventListener('touchstart', function(e) {
                console.log('🎮 Body touchstart detected');
                if (window.game && window.game.getCurrentStage) {
                    const currentStage = window.game.getCurrentStage();
                    console.log('🎮 Current stage on body touch:', currentStage);
                    if (currentStage === 1) {
                        console.log('🎮 Game Over - Body touch detected, restarting game');
                        e.preventDefault();
                        e.stopPropagation();
                        restartGame();
                        return false;
                    }
                }
            }, { passive: false });
            
            document.body.addEventListener('click', function(e) {
                console.log('🎮 Body click detected');
                if (window.game && window.game.getCurrentStage) {
                    const currentStage = window.game.getCurrentStage();
                    console.log('🎮 Current stage on body click:', currentStage);
                    if (currentStage === 1) {
                        console.log('🎮 Game Over - Body click detected, restarting game');
                        e.preventDefault();
                        e.stopPropagation();
                        restartGame();
                        return false;
                    }
                }
            });
            
            // Virtual controls are completely hidden for clean screen
            
            // Monitoramento simplificado - os controles virtuais já verificam o stage no método draw
            
            // Enhanced mobile optimization
            function optimizeForMobile() {
                // Disable text selection
                document.body.style.webkitUserSelect = 'none';
                document.body.style.mozUserSelect = 'none';
                document.body.style.msUserSelect = 'none';
                document.body.style.userSelect = 'none';
                
                // Disable touch callouts
                document.body.style.webkitTouchCallout = 'none';
                
                // Disable pull-to-refresh
                document.body.style.overscrollBehavior = 'none';
                
                // Optimize canvas for mobile
                canvas.style.imageRendering = 'pixelated';
                canvas.style.imageRendering = '-moz-crisp-edges';
                canvas.style.imageRendering = 'crisp-edges';
            }
            
            optimizeForMobile();
            
            
            // Mobile-optimized canvas resize responsivo
            function resizeCanvas() {
                const container = document.querySelector('.game-container');
                const containerWidth = container.clientWidth;
                const containerHeight = container.clientHeight;
                const screenWidth = window.innerWidth;
                const screenHeight = window.innerHeight;
                const isLandscape = screenWidth > screenHeight;
                
                // Game aspect ratio (960x640)
                const gameAspectRatio = 960 / 640;
                const screenAspectRatio = containerWidth / containerHeight;
                
                // Fator de escala responsivo baseado no tamanho da tela
                let scaleFactor = 1.8; // Base
                
                if (screenWidth <= 375) {
                    scaleFactor = 1.4; // Celulares pequenos
                } else if (screenWidth <= 480) {
                    scaleFactor = 1.6; // Celulares médios
                } else if (screenWidth <= 768) {
                    scaleFactor = 1.8; // Celulares grandes
                } else if (screenWidth <= 1024) {
                    scaleFactor = 2.0; // Tablets
                } else {
                    scaleFactor = 2.2; // Desktop
                }
                
                // Ajuste para landscape
                if (isLandscape) {
                    scaleFactor *= 0.9;
                }
                
                let newWidth, newHeight;
                
                if (screenAspectRatio > gameAspectRatio) {
                    // Screen is wider than game - fit to height
                    newHeight = containerHeight - 40; // Account for lives display
                    newWidth = newHeight * gameAspectRatio;
                } else {
                    // Screen is taller than game - fit to width
                    newWidth = containerWidth;
                    newHeight = newWidth / gameAspectRatio;
                }
                
                // Aplicar fator de escala responsivo
                newWidth = newWidth * scaleFactor;
                newHeight = newHeight * scaleFactor;
                
                canvas.style.width = newWidth + 'px';
                canvas.style.height = newHeight + 'px';
                
                // Center the canvas with maximum extreme right offset
                canvas.style.marginLeft = (containerWidth - newWidth) / 2 + 160 + 'px'; // +160px para direita (aumentado de 120px)
                canvas.style.marginTop = (containerHeight - newHeight) / 2 - 30 + 'px';
                
                // Responsive positioning para mobile
                if (window.innerWidth <= 768) {
                    canvas.style.position = 'fixed';
                    canvas.style.top = '50%';
                    canvas.style.left = '75%'; // Movido de 70% para 75% (deslocamento máximo extremo para direita)
                    canvas.style.transform = 'translate(-50%, -50%)';
                    canvas.style.marginLeft = '0px';
                    canvas.style.marginTop = '0px';
                } else {
                    canvas.style.position = 'relative';
                    canvas.style.transform = 'none';
                }
            }
            
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();
        });
    </script>
</body>
</html>
