<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pac Social</title>
    <link rel="shortcut icon" href="favicon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
        }
        
        .game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #000;
            overflow: hidden;
            touch-action: manipulation;
        }
        
        #canvas {
            width: 100vw;
            height: 100vh;
            background: #000;
            display: block;
            object-fit: contain;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
            padding-bottom: 20px;
            visibility: visible;
            opacity: 1;
        }
        
        /* Mobile-first design - Small phones (320px-375px) */
        @media (max-width: 375px) {
            #canvas {
                width: 100vw;
                height: 100vh;
                object-fit: contain;
                transform: scale(0.9);
                transform-origin: center;
            }
        }
        
        /* Medium phones (376px-480px) */
        @media (min-width: 376px) and (max-width: 480px) {
            #canvas {
                width: 100vw;
                height: 100vh;
                object-fit: contain;
                transform: scale(1.0);
                transform-origin: center;
            }
        }
        
        /* Large phones (481px-768px) */
        @media (min-width: 481px) and (max-width: 768px) {
            #canvas {
                width: 100vw;
                height: 100vh;
                object-fit: contain;
                transform: scale(1.1);
                transform-origin: center;
            }
        }
        
        /* Tablets (769px-1024px) */
        @media (min-width: 769px) and (max-width: 1024px) {
            #canvas {
                width: 100vw;
                height: 100vh;
                object-fit: contain;
                transform: scale(1.2);
                transform-origin: center;
            }
        }
        
        /* Desktop (1025px+) */
        @media (min-width: 1025px) {
            #canvas {
                width: 100vw;
                height: 100vh;
                object-fit: contain;
                transform: scale(1.3);
                transform-origin: center;
            }
        }
        
        /* Landscape mobile - Small screens */
        @media (orientation: landscape) and (max-height: 500px) {
            #canvas {
                width: 100vw;
                height: 100vh;
                object-fit: contain;
            }
        }
        
        /* Landscape mobile - Medium screens */
        @media (orientation: landscape) and (min-height: 501px) and (max-height: 600px) {
            #canvas {
                width: 100vw;
                height: 100vh;
                object-fit: contain;
            }
        }
        
        /* Portrait mobile - All sizes */
        @media (orientation: portrait) and (max-width: 768px) {
            #canvas {
                width: 100vw;
                height: 100vh;
                object-fit: contain;
                transform: scale(1.0);
                transform-origin: center;
            }
        }
        
        /* High DPI displays */
        @media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
            #canvas {
                image-rendering: -webkit-optimize-contrast;
                image-rendering: crisp-edges;
            }
        }
        
        /* Very small screens (iPhone SE, etc.) */
        @media (max-width: 320px) {
            #canvas {
                transform: scale(0.8);
                transform-origin: center;
            }
        }
        
        /* Large tablets and small desktops */
        @media (min-width: 1025px) and (max-width: 1440px) {
            #canvas {
                transform: scale(1.4);
                transform-origin: center;
            }
        }
        
        /* Large desktops */
        @media (min-width: 1441px) {
            #canvas {
                transform: scale(1.6);
                transform-origin: center;
            }
        }
        
        /* Ultra-wide screens */
        @media (min-width: 1920px) {
            #canvas {
                transform: scale(1.8);
                transform-origin: center;
            }
        }
        
        
        
        
        
        
        
    </style>
</head>
<body>
    <div class="game-container">
        
        <canvas id="canvas" width="960" height="640">Jogo não suportado</canvas>
        
        
    </div>

    <script src="./static/script/game.js"></script>
    <script src="./static/script/index.js"></script>
    <script src="./static/script/mobile-gestures.js"></script>
    <script src="./static/script/virtual-controls.js"></script>
    
    <script>
        // Mobile controls with advanced gesture support
        document.addEventListener('DOMContentLoaded', function() {
            const canvas = document.getElementById('canvas');
            
            // Initialize mobile gestures
            const gestures = new MobileGestures(canvas, {
                minSwipeDistance: 25,
                maxSwipeTime: 400,
                doubleTapDelay: 300,
                longPressDelay: 600
            });
            
            // Initialize virtual controls responsivos
            function getResponsiveControlSize() {
                const screenWidth = window.innerWidth;
                const screenHeight = window.innerHeight;
                const isLandscape = screenWidth > screenHeight;
                
                // Tamanho base responsivo
                let baseSize = 60;
                let basePadding = 15;
                
                if (screenWidth <= 375) {
                    // Celulares pequenos
                    baseSize = 50;
                    basePadding = 12;
                } else if (screenWidth <= 480) {
                    // Celulares médios
                    baseSize = 60;
                    basePadding = 15;
                } else if (screenWidth <= 768) {
                    // Celulares grandes
                    baseSize = 70;
                    basePadding = 18;
                } else if (screenWidth <= 1024) {
                    // Tablets
                    baseSize = 80;
                    basePadding = 20;
                } else {
                    // Desktop
                    baseSize = 90;
                    basePadding = 25;
                }
                
                // Ajuste para landscape
                if (isLandscape) {
                    baseSize *= 0.8;
                    basePadding *= 0.8;
                }
                
                return { size: baseSize, padding: basePadding };
            }
            
            const controlConfig = getResponsiveControlSize();
            const virtualControls = new VirtualControls(canvas, {
                size: controlConfig.size,
                padding: controlConfig.padding,
                opacity: 0.8,
                showLabels: true
            });
            
            // Gesture callbacks
            gestures.onSwipe(function(data) {
                console.log('Swipe detected:', data.direction);
                simulateKeyPress(data.direction);
            });
            
            gestures.onTap(function(data) {
                console.log('Tap detected at:', data.x, data.y);
                // Pause/unpause on tap
                simulateKeyPress('space');
            });
            
            gestures.onDoubleTap(function(data) {
                console.log('Double tap detected');
                // Restart game on double tap
                if (window.game && window.game.getStages) {
                    const stages = window.game.getStages();
                    if (stages.length > 0) {
                        window.game.setStage(0);
                    }
                }
            });
            
            gestures.onLongPress(function(data) {
                console.log('Long press detected');
                // Show menu or special action
                virtualControls.toggle();
            });
            
            // Virtual controls callbacks
            virtualControls.onDirection(function(direction) {
                console.log('Virtual direction:', direction);
                simulateKeyPress(direction);
            });
            
            virtualControls.onAction(function(action) {
                console.log('Virtual action:', action);
                simulateKeyPress(action);
            });
            
            // Prevent scrolling and context menu
            document.addEventListener('touchmove', function(e) {
                e.preventDefault();
            }, { passive: false });
            
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
            });
            
            // Keyboard support for desktop
            document.addEventListener('keydown', function(e) {
                if (e.code === 'Space') {
                    e.preventDefault();
                    simulateKeyPress('space');
                }
            });
            
            function simulateKeyPress(key) {
                let keyCode;
                switch(key) {
                    case 'up': keyCode = 38; break;
                    case 'down': keyCode = 40; break;
                    case 'left': keyCode = 37; break;
                    case 'right': keyCode = 39; break;
                    case 'space': keyCode = 32; break;
                }
                
                if (keyCode) {
                    const event = new KeyboardEvent('keydown', {
                        keyCode: keyCode,
                        which: keyCode,
                        key: key === 'space' ? ' ' : key
                    });
                    document.dispatchEvent(event);
                }
            }
            
            // Enhanced mobile detection
            function isMobileDevice() {
                return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ||
                       (navigator.maxTouchPoints && navigator.maxTouchPoints > 1);
            }
            
            // Show/hide virtual controls based on device
            if (isMobileDevice()) {
                virtualControls.show();
            } else {
                virtualControls.hide();
            }
            
            // Orientation change handling
            window.addEventListener('orientationchange', function() {
                setTimeout(function() {
                    resizeCanvas();
                    // Redimensionar controles virtuais
                    const newConfig = getResponsiveControlSize();
                    virtualControls.size = newConfig.size;
                    virtualControls.padding = newConfig.padding;
                    virtualControls.createDPad();
                    virtualControls.createActionButtons();
                }, 100);
            });
            
            // Resize handling para mudanças de tamanho de tela
            window.addEventListener('resize', function() {
                setTimeout(function() {
                    resizeCanvas();
                    // Redimensionar controles virtuais
                    const newConfig = getResponsiveControlSize();
                    virtualControls.size = newConfig.size;
                    virtualControls.padding = newConfig.padding;
                    virtualControls.createDPad();
                    virtualControls.createActionButtons();
                }, 100);
            });
            
            // Enhanced touch feedback
            function addTouchFeedback() {
                const feedback = document.createElement('div');
                feedback.style.cssText = `
                    position: fixed;
                    width: 20px;
                    height: 20px;
                    background: rgba(255, 255, 255, 0.8);
                    border-radius: 50%;
                    pointer-events: none;
                    z-index: 9999;
                    transform: translate(-50%, -50%);
                    animation: touchFeedback 0.3s ease-out;
                `;
                
                document.body.appendChild(feedback);
                
                setTimeout(() => {
                    document.body.removeChild(feedback);
                }, 300);
            }
            
            // Add CSS for touch feedback animation
            const style = document.createElement('style');
            style.textContent = `
                @keyframes touchFeedback {
                    0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
                    100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
                }
            `;
            document.head.appendChild(style);
            
            // Add touch feedback to gestures
            gestures.onTap(function(data) {
                addTouchFeedback();
            });
            
            gestures.onSwipe(function(data) {
                addTouchFeedback();
            });
            
            // Expose controls globally for game integration
            window.gestures = gestures;
            window.virtualControls = virtualControls;
            
            // Enhanced mobile optimization
            function optimizeForMobile() {
                // Disable text selection
                document.body.style.webkitUserSelect = 'none';
                document.body.style.mozUserSelect = 'none';
                document.body.style.msUserSelect = 'none';
                document.body.style.userSelect = 'none';
                
                // Disable touch callouts
                document.body.style.webkitTouchCallout = 'none';
                
                // Disable pull-to-refresh
                document.body.style.overscrollBehavior = 'none';
                
                // Optimize canvas for mobile
                canvas.style.imageRendering = 'pixelated';
                canvas.style.imageRendering = '-moz-crisp-edges';
                canvas.style.imageRendering = 'crisp-edges';
            }
            
            optimizeForMobile();
            
            
            // Mobile-optimized canvas resize responsivo
            function resizeCanvas() {
                const container = document.querySelector('.game-container');
                const containerWidth = container.clientWidth;
                const containerHeight = container.clientHeight;
                const screenWidth = window.innerWidth;
                const screenHeight = window.innerHeight;
                const isLandscape = screenWidth > screenHeight;
                
                // Game aspect ratio (960x640)
                const gameAspectRatio = 960 / 640;
                const screenAspectRatio = containerWidth / containerHeight;
                
                // Fator de escala responsivo baseado no tamanho da tela
                let scaleFactor = 1.8; // Base
                
                if (screenWidth <= 375) {
                    scaleFactor = 1.4; // Celulares pequenos
                } else if (screenWidth <= 480) {
                    scaleFactor = 1.6; // Celulares médios
                } else if (screenWidth <= 768) {
                    scaleFactor = 1.8; // Celulares grandes
                } else if (screenWidth <= 1024) {
                    scaleFactor = 2.0; // Tablets
                } else {
                    scaleFactor = 2.2; // Desktop
                }
                
                // Ajuste para landscape
                if (isLandscape) {
                    scaleFactor *= 0.9;
                }
                
                let newWidth, newHeight;
                
                if (screenAspectRatio > gameAspectRatio) {
                    // Screen is wider than game - fit to height
                    newHeight = containerHeight - 40; // Account for lives display
                    newWidth = newHeight * gameAspectRatio;
                } else {
                    // Screen is taller than game - fit to width
                    newWidth = containerWidth;
                    newHeight = newWidth / gameAspectRatio;
                }
                
                // Aplicar fator de escala responsivo
                newWidth = newWidth * scaleFactor;
                newHeight = newHeight * scaleFactor;
                
                canvas.style.width = newWidth + 'px';
                canvas.style.height = newHeight + 'px';
                
                // Center the canvas with maximum extreme right offset
                canvas.style.marginLeft = (containerWidth - newWidth) / 2 + 160 + 'px'; // +160px para direita (aumentado de 120px)
                canvas.style.marginTop = (containerHeight - newHeight) / 2 - 30 + 'px';
                
                // Responsive positioning para mobile
                if (window.innerWidth <= 768) {
                    canvas.style.position = 'fixed';
                    canvas.style.top = '50%';
                    canvas.style.left = '75%'; // Movido de 70% para 75% (deslocamento máximo extremo para direita)
                    canvas.style.transform = 'translate(-50%, -50%)';
                    canvas.style.marginLeft = '0px';
                    canvas.style.marginTop = '0px';
                } else {
                    canvas.style.position = 'relative';
                    canvas.style.transform = 'none';
                }
            }
            
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();
        });
    </script>
</body>
</html>
