<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venge.io - Jogar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .ad-container {
            width: 100%;
            height: 60px;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #ddd;
            position: relative;
        }

        .ad-placeholder {
            width: 100%;
            max-width: 320px;
            height: 50px;
            background: linear-gradient(135deg, #E91E63, #C2185B);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 14px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
            margin: 0 10px;
        }

        .game-container {
            flex: 1;
            position: relative;
            background: #000;
        }

        .game-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .close-button {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .close-button:hover {
            background: rgba(255,0,0,0.8);
            transform: scale(1.1);
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            z-index: 999;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            z-index: 999;
            background: rgba(0,0,0,0.8);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .error-message h3 {
            font-size: 24px;
            margin-bottom: 15px;
            color: #E91E63;
        }

        .error-message p {
            font-size: 16px;
            margin-bottom: 20px;
            opacity: 0.9;
        }

        .retry-button {
            background: linear-gradient(135deg, #E91E63, #C2185B);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 5px;
        }

        .retry-button:hover {
            transform: scale(1.05);
        }

        .game-status {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0,255,0,0.2);
            color: #00ff00;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            z-index: 1001;
        }

        /* Responsivo para mobile */
        @media (max-width: 480px) {
            .ad-container {
                height: 50px;
            }
            
            .ad-placeholder {
                height: 40px;
                font-size: 12px;
                margin: 0 5px;
            }
            
            .close-button {
                top: 10px;
                right: 10px;
                width: 30px;
                height: 30px;
                font-size: 16px;
            }
            
            .game-status {
                top: 10px;
                left: 10px;
                font-size: 10px;
                padding: 3px 6px;
            }
        }

        /* Para telas muito pequenas */
        @media (max-width: 360px) {
            .ad-container {
                height: 45px;
            }
            
            .ad-placeholder {
                height: 35px;
                font-size: 11px;
            }
            
            .close-button {
                width: 28px;
                height: 28px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <!-- Área do anúncio -->
    <div class="ad-container">
        <div class="ad-placeholder">
            📢 Anúncio Mobile<br>
            <small>320x50</small>
        </div>
    </div>

    <!-- Container do jogo -->
    <div class="game-container">
        <!-- Botão X para fechar -->
        <button class="close-button" onclick="goBack()">
            ×
        </button>

        <!-- Status do jogo -->
        <div class="game-status" id="gameStatus">
            🔄 Carregando...
        </div>

        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
        </div>

        <!-- Iframe do jogo -->
        <iframe 
            class="game-iframe" 
            id="gameFrame"
            src=""
            allowfullscreen
            allow="autoplay; fullscreen; microphone; camera"
            onload="hideLoading()"
            onerror="handleIframeError()">
        </iframe>
    </div>

    <script>
        let currentGameIndex = 0;
        
        // URLs do Venge.io para tentar
        const vengeUrls = [
            'https://venge.io/',
            'https://venge.io/game',
            'https://venge.io/play',
            'https://www.venge.io/',
            'https://www.venge.io/game',
            'https://www.venge.io/play'
        ];

        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'lista-jogos-vertical.html';
            }
        }

        function hideLoading() {
            const loading = document.getElementById('loading');
            const gameStatus = document.getElementById('gameStatus');
            
            if (loading) {
                loading.style.display = 'none';
            }
            
            if (gameStatus) {
                gameStatus.textContent = '✅ Venge.io Carregado';
                gameStatus.style.background = 'rgba(0,255,0,0.2)';
                gameStatus.style.color = '#00ff00';
            }
        }

        function showError() {
            const loading = document.getElementById('loading');
            const gameStatus = document.getElementById('gameStatus');
            
            if (gameStatus) {
                gameStatus.textContent = '❌ Erro de Carregamento';
                gameStatus.style.background = 'rgba(255,0,0,0.2)';
                gameStatus.style.color = '#ff0000';
            }
            
            if (loading) {
                loading.innerHTML = `
                    <div class="error-message">
                        <h3>🔫 Venge.io FPS</h3>
                        <p>Não foi possível carregar o jogo no iframe.</p>
                        <p>O site pode bloquear incorporação por segurança.</p>
                        <button class="retry-button" onclick="tryNextUrl()">
                            🔄 Tentar Outra URL
                        </button>
                        <button class="retry-button" onclick="openInNewTab()">
                            🎯 Jogar em Nova Aba
                        </button>
                    </div>
                `;
            }
        }

        function handleIframeError() {
            console.log('Erro no iframe, tentando próxima URL...');
            tryNextUrl();
        }

        function tryNextUrl() {
            currentGameIndex++;
            const gameFrame = document.getElementById('gameFrame');
            const loading = document.getElementById('loading');
            const gameStatus = document.getElementById('gameStatus');
            
            if (currentGameIndex < vengeUrls.length) {
                const gameUrl = vengeUrls[currentGameIndex];
                
                if (loading) {
                    loading.innerHTML = `
                        <div class="spinner"></div>
                    `;
                }
                
                if (gameStatus) {
                    gameStatus.textContent = `🔄 URL ${currentGameIndex + 1}`;
                    gameStatus.style.background = 'rgba(255,255,0,0.2)';
                    gameStatus.style.color = '#ffff00';
                }
                
                setTimeout(() => {
                    console.log('Tentando URL:', gameUrl);
                    gameFrame.src = gameUrl;
                }, 1000);
            } else {
                showError();
            }
        }

        function openInNewTab() {
            window.open('https://venge.io/', '_blank');
        }

        // Inicia carregando o jogo
        function startGame() {
            const gameFrame = document.getElementById('gameFrame');
            const gameStatus = document.getElementById('gameStatus');
            
            if (gameStatus) {
                gameStatus.textContent = '🔄 Conectando ao Venge.io...';
                gameStatus.style.background = 'rgba(255,255,0,0.2)';
                gameStatus.style.color = '#ffff00';
            }
            
            // Tenta a primeira URL
            const firstUrl = vengeUrls[0];
            console.log('Tentando carregar Venge.io:', firstUrl);
            gameFrame.src = firstUrl;
        }

        // Inicia o jogo quando a página carrega
        window.addEventListener('load', startGame);

        // Esconde o loading após 10 segundos como fallback
        setTimeout(() => {
            const loading = document.getElementById('loading');
            if (loading && loading.style.display !== 'none') {
                tryNextUrl();
            }
        }, 10000);

        // Adiciona suporte para teclas de navegação
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                goBack();
            }
        });

        // Previne zoom em dispositivos móveis
        document.addEventListener('gesturestart', function (e) {
            e.preventDefault();
        });

        // Otimizações para mobile
        if (window.innerWidth <= 768) {
            document.body.style.touchAction = 'manipulation';
        }

        // Monitora mudanças no iframe
        const gameFrame = document.getElementById('gameFrame');
        if (gameFrame) {
            gameFrame.addEventListener('load', function() {
                console.log('Iframe Venge.io carregado com sucesso');
                hideLoading();
            });
        }

        // Função para recarregar o jogo
        function reloadGame() {
            const gameFrame = document.getElementById('gameFrame');
            const loading = document.getElementById('loading');
            const gameStatus = document.getElementById('gameStatus');
            
            if (loading) {
                loading.style.display = 'block';
                loading.innerHTML = `
                    <div class="spinner"></div>
                `;
            }
            
            if (gameStatus) {
                gameStatus.textContent = '🔄 Recarregando...';
                gameStatus.style.background = 'rgba(255,255,0,0.2)';
                gameStatus.style.color = '#ffff00';
            }
            
            // Reinicia do primeiro método
            currentGameIndex = 0;
            const firstUrl = vengeUrls[0];
            gameFrame.src = firstUrl;
        }

        // Adiciona botão de home próximo ao botão X
        setTimeout(() => {
            const gameContainer = document.querySelector('.game-container');
            if (gameContainer) {
                const homeButton = document.createElement('button');
                homeButton.innerHTML = '⌂';
                homeButton.style.cssText = `
                    position: absolute;
                    top: 15px;
                    right: 60px;
                    background: rgba(255,255,255,0.15);
                    border: none;
                    color: white;
                    width: 30px;
                    height: 30px;
                    border-radius: 50%;
                    cursor: pointer;
                    font-size: 16px;
                    transition: all 0.3s ease;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    z-index: 1000;
                    backdrop-filter: blur(10px);
                    opacity: 0.7;
                `;
                homeButton.onclick = goBack;
                homeButton.onmouseover = function() {
                    this.style.background = 'rgba(255,255,255,0.25)';
                    this.style.transform = 'scale(1.05)';
                    this.style.opacity = '1';
                };
                homeButton.onmouseout = function() {
                    this.style.background = 'rgba(255,255,255,0.15)';
                    this.style.transform = 'scale(1)';
                    this.style.opacity = '0.7';
                };
                gameContainer.appendChild(homeButton);
            }
        }, 1000);

        // Log de debug
        console.log('Venge.io carregado');
        console.log('URLs do Venge.io:', vengeUrls);
    </script>
</body>
</html>
