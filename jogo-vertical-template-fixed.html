<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Jogo Vertical - Portal de Jogos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #000;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            margin: 0;
            padding: 0;
        }

        /* BANNER SIMPLES 320x100 - Apenas texto preto */
        .banner-ad {
            width: 100%;
            max-width: 320px;
            height: 100px;
            margin: 0 auto;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        /* Container do jogo - ocupa o resto da tela */
        .game-container {
            width: 100%;
            height: calc(100vh - 100px);
            margin: 0;
            padding: 0;
            background: #000;
        }

        .game-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        /* Estilos específicos para jogos horizontais */
        .game-iframe.horizontal {
            height: 100%;
        }

        /* Container adaptável para orientação */
        .game-container.horizontal {
            height: calc(100vh - 100px);
        }

        /* Navigation Drawer lateral estilo Apple */
        .nav-drawer {
            position: fixed;
            bottom: 80px;
            right: 0;
            z-index: 1000;
        }

        .nav-toggle {
            width: 40px;
            height: 80px;
            background: rgba(255,255,255,0.9);
            border: none;
            border-radius: 20px 0 0 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: -2px 0 8px rgba(0,0,0,0.15);
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .nav-toggle:hover {
            background: rgba(255,255,255,1);
            transform: translateX(-5px);
            box-shadow: -4px 0 12px rgba(0,0,0,0.2);
        }

        .nav-toggle.active {
            background: rgba(0,0,0,0.8);
        }

        /* Barrinha arredondada */
        .nav-toggle::before {
            content: '';
            width: 20px;
            height: 3px;
            background: #000;
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .nav-toggle.active::before {
            background: white;
        }

        .nav-menu {
            position: fixed;
            top: 0;
            right: -300px;
            width: 300px;
            height: 100vh;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(20px);
            transition: all 0.3s ease;
            padding: 60px 20px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-left: 1px solid rgba(255,255,255,0.1);
        }

        .nav-menu.active {
            right: 0;
        }

        /* Carrossel de opções */
        .nav-carousel {
            display: flex;
            flex-direction: column;
            gap: 40px;
            align-items: center;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: white;
            text-decoration: none;
            border-radius: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            min-width: 120px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .nav-item:hover {
            background: rgba(255,255,255,0.1);
            transform: scale(1.05);
            border-color: rgba(255,255,255,0.2);
        }

        .nav-item:active {
            background: rgba(255,255,255,0.15);
            transform: scale(0.95);
        }

        .nav-item-icon {
            font-size: 32px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }

        .nav-item:hover .nav-item-icon {
            transform: scale(1.1);
        }

        /* Overlay para fechar o drawer */
        .nav-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.3);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 999;
        }

        .nav-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            background: #000;
            color: white;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .loading-subtext {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        /* Aviso de erro */
        .error-message {
            background: #333;
            border: 1px solid #666;
            border-radius: 8px;
            padding: 15px;
            margin: 15px;
            color: white;
            text-align: center;
        }

        .error-message h4 {
            margin-bottom: 10px;
        }

        .error-message p {
            margin-bottom: 10px;
        }

        .error-message button {
            background: #666;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            margin: 0 5px;
        }

        /* Debug Logs Area */
        .debug-logs {
            position: fixed;
            top: 10px;
            left: 10px;
            width: 400px;
            max-height: 300px;
            background: rgba(0,0,0,0.9);
            border: 2px solid #00ff00;
            border-radius: 10px;
            padding: 15px;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.4;
            z-index: 10000;
            overflow-y: auto;
            display: none;
        }

        .debug-logs.show {
            display: block;
        }

        .debug-logs .log-entry {
            margin-bottom: 5px;
            padding: 2px 0;
            border-bottom: 1px solid rgba(0,255,0,0.2);
        }

        .debug-logs .log-entry:last-child {
            border-bottom: none;
        }

        .debug-logs .log-time {
            color: #888;
            font-size: 10px;
        }

        .debug-logs .log-error {
            color: #ff4444;
        }

        .debug-logs .log-success {
            color: #44ff44;
        }

        .debug-logs .log-info {
            color: #4444ff;
        }

        /* Toggle button for debug logs */
        .debug-toggle {
            position: fixed;
            top: 10px;
            right: 10px;
            background: #00ff00;
            color: #000;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            z-index: 10001;
        }

        .debug-toggle:hover {
            background: #00cc00;
        }

        /* Botões na parte inferior da tela */
        .bottom-controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 1000;
        }

        .bottom-btn {
            background: rgba(0,0,0,0.8);
            color: white;
            border: 2px solid rgba(255,255,255,0.3);
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            min-width: 100px;
        }

        .bottom-btn:hover {
            background: rgba(255,255,255,0.9);
            color: #000;
            border-color: rgba(255,255,255,0.9);
            transform: translateY(-2px);
        }

        .bottom-btn.assistir {
            background: rgba(255,0,0,0.8);
            border-color: rgba(255,0,0,0.8);
        }

        .bottom-btn.assistir:hover {
            background: rgba(255,0,0,1);
            border-color: rgba(255,0,0,1);
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Banner simples 320x100 -->
        <div class="banner-ad">
            320x100
        </div>

        <!-- Container do jogo - ocupa o resto da tela -->
        <div class="game-container" id="gameContainer">
            <div id="loadingScreen" class="loading-screen">
                <div class="loading-spinner"></div>
                <div class="loading-text">Carregando Jogo...</div>
                <div class="loading-subtext" id="loadingSubtext">Aguarde um momento</div>
            </div>
            
            <div id="errorMessage" class="error-message" style="display: none;">
                <h4>⚠️ Erro ao Carregar o Jogo</h4>
                <p>O jogo não pôde ser carregado devido a restrições de segurança.</p>
                <p>Isso é comum com jogos do Gamezop que não permitem iframes.</p>
                <button onclick="openOriginal()">🌐 Abrir Jogo Original</button>
                <button onclick="goBack()">← Voltar</button>
            </div>
            
            <iframe id="gameFrame" class="game-iframe" src="" style="display: none;"></iframe>
        </div>
    </div>

    <!-- Overlay para fechar o drawer -->
    <div class="nav-overlay" id="navOverlay" onclick="handleOverlayClick(event)"></div>

    <!-- Navigation Drawer lateral estilo Apple -->
    <div class="nav-drawer">
        <button class="nav-toggle" id="navToggle" onclick="addDebugLog('🔍 Botão toggle clicado', 'info'); toggleNav();"></button>
    </div>

    <!-- Menu lateral que desliza -->
    <div class="nav-menu" id="navMenu">
        <div class="nav-carousel">
            <div class="nav-item" id="assistirBtn" onclick="showWatchDialog()">
                <span class="nav-item-icon">👁️</span>
                Assistir
            </div>
            <div class="nav-item" onclick="restartGame()">
                <span class="nav-item-icon">🔄</span>
                Reiniciar
            </div>
            <div class="nav-item" onclick="goBack()">
                <span class="nav-item-icon">🚪</span>
                Sair
            </div>
        </div>
    </div>

    <!-- Debug Logs Area -->
    <div class="debug-logs" id="debugLogs">
        <div style="color: #00ff00; font-weight: bold; margin-bottom: 10px; text-align: center;">
            🔍 DEBUG LOGS
        </div>
        <div id="logEntries"></div>
    </div>

    <!-- Debug Toggle Button -->
    <button class="debug-toggle" id="debugToggle" onclick="toggleDebugLogs()">
        DEBUG
    </button>

    <!-- Botões na parte inferior da tela -->
    <div class="bottom-controls">
        <button class="bottom-btn assistir" onclick="addDebugLog('🔍 Botão Assistir clicado (inferior)', 'success'); openYouTubePIP();">
            📺 Assistir
        </button>
        <button class="bottom-btn" onclick="addDebugLog('🔍 Botão Sair clicado (inferior)', 'info'); goBack();">
            🚪 Sair
        </button>
    </div>

    <script>
        // Sistema de Logs Visuais
        function addDebugLog(message, type = 'info') {
            const logEntries = document.getElementById('logEntries');
            const time = new Date().toLocaleTimeString();
            
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry log-${type}`;
            logEntry.innerHTML = `
                <span class="log-time">[${time}]</span> ${message}
            `;
            
            logEntries.appendChild(logEntry);
            
            // Auto-scroll para o último log
            logEntries.scrollTop = logEntries.scrollHeight;
            
            // Limita a 50 logs para não sobrecarregar
            const entries = logEntries.children;
            if (entries.length > 50) {
                entries[0].remove();
            }
            
            // Também loga no console
            console.log(message);
        }

        function toggleDebugLogs() {
            const debugLogs = document.getElementById('debugLogs');
            const debugToggle = document.getElementById('debugToggle');
            
            if (debugLogs.classList.contains('show')) {
                debugLogs.classList.remove('show');
                debugToggle.textContent = 'DEBUG';
                debugToggle.style.background = '#00ff00';
            } else {
                debugLogs.classList.add('show');
                debugToggle.textContent = 'HIDE';
                debugToggle.style.background = '#ff0000';
            }
        }

        function clearDebugLogs() {
            document.getElementById('logEntries').innerHTML = '';
        }

        // Função para obter parâmetros da URL
        function getUrlParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        // Função para voltar
        function goBack() {
            const returnUrl = getUrlParameter('return') || 'index.html';
            window.location.href = returnUrl;
        }

        // Variáveis globais para o jogo
        let currentGameUrl = '';
        let currentGameTitle = '';

        // Carrega o jogo baseado nos parâmetros da URL
        function loadGame() {
            const gameUrl = getUrlParameter('url');
            const gameTitle = getUrlParameter('title') || 'Jogo';
            const gameOrientation = getUrlParameter('orientation') || 'vertical';
            
            if (!gameUrl) {
                alert('URL do jogo não encontrada!');
                goBack();
                return;
            }

            // Armazena informações do jogo
            currentGameUrl = gameUrl;
            currentGameTitle = gameTitle;

            // Atualiza o título da página
            document.getElementById('pageTitle').textContent = gameTitle + ' - Portal de Jogos';
            document.getElementById('loadingSubtext').textContent = gameTitle;
            
            // Ajusta o container baseado na orientação
            const gameContainer = document.getElementById('gameContainer');
            const gameFrame = document.getElementById('gameFrame');
            
            if (gameOrientation === 'horizontal') {
                gameContainer.classList.add('horizontal');
                gameFrame.classList.add('horizontal');
            }
            
            // Carrega o iframe do jogo
            gameFrame.src = gameUrl;
            
            // Verifica se é um jogo do Gamezop (que pode ter problemas de CSP)
            if (gameUrl.includes('gamezop.com')) {
                // Para jogos do Gamezop, mostra erro após 3 segundos se não carregar
                setTimeout(function() {
                    if (gameFrame.style.display === 'none') {
                        showErrorMessage();
                    }
                }, 3000);
            } else {
                // Para jogos locais, comportamento normal
                setTimeout(function() {
                    document.getElementById('loadingScreen').style.display = 'none';
                    gameFrame.style.display = 'block';
                }, 2000);
            }
        }

        function showErrorMessage() {
            document.getElementById('loadingScreen').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'block';
        }

        function openOriginal() {
            if (currentGameUrl) {
                window.open(currentGameUrl, '_blank');
            }
        }

        // Funções do Navigation Drawer lateral
        function toggleNav() {
            addDebugLog('🔍 toggleNav() chamada', 'info');
            const navToggle = document.getElementById('navToggle');
            const navMenu = document.getElementById('navMenu');
            const navOverlay = document.getElementById('navOverlay');
            
            if (navToggle && navMenu && navOverlay) {
                addDebugLog('🔍 Elementos do menu encontrados', 'success');
                navToggle.classList.toggle('active');
                navMenu.classList.toggle('active');
                navOverlay.classList.toggle('active');
                
                const isActive = navMenu.classList.contains('active');
                addDebugLog(`🔍 Menu ${isActive ? 'ABERTO' : 'FECHADO'}`, isActive ? 'success' : 'info');
            } else {
                addDebugLog('❌ ERRO: Elementos do menu não encontrados!', 'error');
            }
        }

        function handleOverlayClick(event) {
            addDebugLog('🔍 Overlay clicado', 'info');
            
            // Verifica se o clique foi no menu ou em um botão do menu
            const navMenu = document.getElementById('navMenu');
            if (navMenu && navMenu.contains(event.target)) {
                addDebugLog('🔍 Clique foi no menu, não fechando', 'info');
                return; // Não fecha o menu se o clique foi no menu
            }
            
            addDebugLog('🔍 Clique foi no overlay, fechando menu', 'info');
            closeNav();
        }

        function closeNav() {
            addDebugLog('🔍 closeNav() chamada', 'info');
            const navToggle = document.getElementById('navToggle');
            const navMenu = document.getElementById('navMenu');
            const navOverlay = document.getElementById('navOverlay');
            
            if (navToggle && navMenu && navOverlay) {
                navToggle.classList.remove('active');
                navMenu.classList.remove('active');
                navOverlay.classList.remove('active');
                addDebugLog('🔍 Menu fechado com sucesso', 'success');
            } else {
                addDebugLog('❌ ERRO: Elementos do menu não encontrados para fechar!', 'error');
            }
        }

        function showWatchDialog() {
            addDebugLog('🔍 showWatchDialog() chamada', 'info');
            
            // Fecha o menu primeiro
            closeNav();
            
            // Cria o diálogo diretamente
            const dialog = document.createElement('div');
            dialog.id = 'watchDialog';
            dialog.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0,0,0,0.8);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 10000;
            `;
            
            dialog.innerHTML = `
                <div style="
                    background: white;
                    border-radius: 15px;
                    padding: 30px;
                    max-width: 400px;
                    width: 90%;
                    text-align: center;
                    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
                    position: relative;
                ">
                    <button onclick="closeWatchDialog()" style="
                        position: absolute;
                        top: 10px;
                        right: 15px;
                        background: none;
                        border: none;
                        font-size: 24px;
                        cursor: pointer;
                        color: #666;
                        width: 30px;
                        height: 30px;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                    ">×</button>
                    
                    <h3 style="margin-bottom: 20px; color: #333; font-size: 1.5rem;">📺 Assistir Vídeo</h3>
                    <p style="margin-bottom: 25px; color: #666; line-height: 1.5;">
                        Abrir YouTube PIP para assistir vídeos enquanto joga?
                    </p>
                    <div style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
                        <button onclick="openYouTubePIP()" style="
                            background: #ff0000;
                            color: white;
                            border: none;
                            padding: 12px 24px;
                            border-radius: 25px;
                            cursor: pointer;
                            font-weight: bold;
                            font-size: 1rem;
                            min-width: 150px;
                        ">
                            📺 Abrir YouTube PIP
                        </button>
                        <button onclick="closeWatchDialog()" style="
                            background: #666;
                            color: white;
                            border: none;
                            padding: 12px 24px;
                            border-radius: 25px;
                            cursor: pointer;
                            font-weight: bold;
                            font-size: 1rem;
                            min-width: 100px;
                        ">
                            ❌ Cancelar
                        </button>
                    </div>
                </div>
            `;
            
            document.body.appendChild(dialog);
            addDebugLog('🔍 Diálogo criado e adicionado ao body', 'success');
        }

        function openYouTubePIP() {
            addDebugLog('🔍 openYouTubePIP() chamada', 'info');
            
            // Cria um diálogo com o YouTube PIP dentro da tela
            const pipDialog = document.createElement('div');
            pipDialog.id = 'youtubePipDialog';
            pipDialog.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0,0,0,0.9);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 10000;
            `;
            
            pipDialog.innerHTML = `
                <div style="
                    background: #000;
                    border-radius: 15px;
                    width: 90%;
                    max-width: 800px;
                    height: 80%;
                    max-height: 600px;
                    position: relative;
                    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
                ">
                    <button onclick="closeYouTubePIP()" style="
                        position: absolute;
                        top: 10px;
                        right: 15px;
                        background: rgba(255,255,255,0.2);
                        border: none;
                        color: white;
                        font-size: 24px;
                        cursor: pointer;
                        width: 35px;
                        height: 35px;
                        border-radius: 50%;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        z-index: 10001;
                    ">×</button>
                    
                    <iframe 
                        src="youtube-pip.html" 
                        style="
                            width: 100%;
                            height: 100%;
                            border: none;
                            border-radius: 15px;
                        "
                        frameborder="0"
                        allowfullscreen>
                    </iframe>
                </div>
            `;
            
            // Adiciona event listener para fechar ao clicar no fundo
            pipDialog.addEventListener('click', (e) => {
                if (e.target === pipDialog) {
                    addDebugLog('🔍 Clique no fundo do diálogo YouTube PIP', 'info');
                    closeYouTubePIP();
                }
            });
            
            document.body.appendChild(pipDialog);
            addDebugLog('🔍 Diálogo YouTube PIP criado e adicionado ao body', 'success');
        }

        function closeYouTubePIP() {
            addDebugLog('🔍 closeYouTubePIP() chamada', 'info');
            const dialog = document.getElementById('youtubePipDialog');
            if (dialog) {
                dialog.remove();
                addDebugLog('🔍 Diálogo YouTube PIP removido do DOM', 'success');
            } else {
                addDebugLog('🔍 Diálogo YouTube PIP não encontrado para fechar', 'info');
            }
        }

        function closeWatchDialog() {
            addDebugLog('🔍 closeWatchDialog() chamada', 'info');
            const dialog = document.getElementById('watchDialog');
            if (dialog) {
                dialog.remove();
                addDebugLog('🔍 Dialog removido do DOM', 'success');
            } else {
                addDebugLog('🔍 Dialog não encontrado para fechar', 'info');
            }
        }

        function restartGame() {
            // Função para reiniciar o jogo
            const gameFrame = document.getElementById('gameFrame');
            if (gameFrame && gameFrame.src) {
                // Recarrega o iframe do jogo
                gameFrame.src = gameFrame.src;
                closeNav(); // Fecha o drawer
            } else {
                alert('Nenhum jogo carregado para reiniciar!');
                closeNav();
            }
        }

        // Event listener para detectar quando o iframe carrega com sucesso
        document.getElementById('gameFrame').addEventListener('load', function() {
            document.getElementById('loadingScreen').style.display = 'none';
            this.style.display = 'block';
            document.getElementById('gameControls').style.display = 'flex';
        });

        // Event listener para detectar erros no iframe
        document.getElementById('gameFrame').addEventListener('error', function() {
            showErrorMessage();
        });

        // Carrega o jogo quando a página é carregada
        document.addEventListener('DOMContentLoaded', function() {
            addDebugLog('🚀 Página carregada - Sistema de debug ativo', 'success');
            addDebugLog('💡 Clique no botão DEBUG (canto superior direito) para ver os logs', 'info');
            
            // Verifica se os botões inferiores existem
            const bottomControls = document.querySelector('.bottom-controls');
            if (bottomControls) {
                addDebugLog('🔍 Botões inferiores encontrados', 'success');
            } else {
                addDebugLog('❌ ERRO: Botões inferiores não encontrados!', 'error');
            }
            
            // Adiciona logs para outros elementos importantes
            const navMenu = document.getElementById('navMenu');
            if (navMenu) {
                addDebugLog('🔍 Menu lateral encontrado', 'success');
            } else {
                addDebugLog('❌ ERRO: Menu lateral não encontrado!', 'error');
            }
            
            const navToggle = document.getElementById('navToggle');
            if (navToggle) {
                addDebugLog('🔍 Botão toggle do menu encontrado', 'success');
            } else {
                addDebugLog('❌ ERRO: Botão toggle não encontrado!', 'error');
            }
