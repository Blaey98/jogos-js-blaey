<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Jogo Vertical - Portal de Jogos</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7154773731438541"
     crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/global-pip.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #000;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            margin: 0;
            padding: 0;
        }

        /* BANNER SIMPLES 320x100 - Apenas texto preto */
        .banner-ad {
            width: 100%;
            max-width: 320px;
            height: 100px;
            margin: 0 auto;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        /* Container do jogo - ocupa o resto da tela */
        .game-container {
            width: 100%;
            height: calc(100vh - 100px);
            margin: 0;
            padding: 0;
            background: #000;
        }

        .game-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        /* Estilos específicos para jogos horizontais */
        .game-iframe.horizontal {
            height: 100%;
        }

        /* Container adaptável para orientação */
        .game-container.horizontal {
            height: calc(100vh - 100px);
        }

        /* Navigation Drawer lateral estilo Apple */
        .nav-drawer {
            position: fixed;
            bottom: 80px;
            right: 0;
            z-index: 1000;
        }

        .nav-toggle {
            width: 40px;
            height: 80px;
            background: rgba(255,255,255,0.9);
            border: none;
            border-radius: 20px 0 0 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: -2px 0 8px rgba(0,0,0,0.15);
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .nav-toggle:hover {
            background: rgba(255,255,255,1);
            transform: translateX(-5px);
            box-shadow: -4px 0 12px rgba(0,0,0,0.2);
        }

        .nav-toggle.active {
            background: rgba(0,0,0,0.8);
        }

        /* Barrinha arredondada */
        .nav-toggle::before {
            content: '';
            width: 20px;
            height: 3px;
            background: #000;
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .nav-toggle.active::before {
            background: white;
        }

        .nav-menu {
            position: fixed;
            top: 0;
            right: -300px;
            width: 300px;
            height: 100vh;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(20px);
            transition: all 0.3s ease;
            padding: 60px 20px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-left: 1px solid rgba(255,255,255,0.1);
        }

        .nav-menu.active {
            right: 0;
        }

        /* Carrossel de opções */
        .nav-carousel {
            display: flex;
            flex-direction: column;
            gap: 40px;
            align-items: center;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: white;
            text-decoration: none;
            border-radius: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            min-width: 120px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .nav-item:hover {
            background: rgba(255,255,255,0.1);
            transform: scale(1.05);
            border-color: rgba(255,255,255,0.2);
        }

        .nav-item:active {
            background: rgba(255,255,255,0.15);
            transform: scale(0.95);
        }

        .nav-item-icon {
            font-size: 32px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }

        .nav-item:hover .nav-item-icon {
            transform: scale(1.1);
        }

        /* Overlay para fechar o drawer */
        .nav-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.3);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 999;
        }

        .nav-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            background: #000;
            color: white;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .loading-subtext {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .loading-actions {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        .loading-btn {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 8px 16px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .loading-btn:hover {
            background: rgba(255,255,255,0.2);
            border-color: rgba(255,255,255,0.5);
        }

        /* Aviso de erro */
        .error-message {
            background: #333;
            border: 1px solid #666;
            border-radius: 8px;
            padding: 15px;
            margin: 15px;
            color: white;
            text-align: center;
        }

        .error-message h4 {
            margin-bottom: 10px;
        }

        .error-message p {
            margin-bottom: 10px;
        }

        .error-message button {
            background: #666;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            margin: 0 5px;
        }

        /* Debug Logs Area */
        .debug-logs {
            position: fixed;
            top: 10px;
            left: 10px;
            width: 400px;
            max-height: 300px;
            background: rgba(0,0,0,0.9);
            border: 2px solid #00ff00;
            border-radius: 10px;
            padding: 15px;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.4;
            z-index: 10000;
            overflow-y: auto;
            display: none;
        }

        .debug-logs.show {
            display: block;
        }

        .debug-logs .log-entry {
            margin-bottom: 5px;
            padding: 2px 0;
            border-bottom: 1px solid rgba(0,255,0,0.2);
        }

        .debug-logs .log-entry:last-child {
            border-bottom: none;
        }

        .debug-logs .log-time {
            color: #888;
            font-size: 10px;
        }

        .debug-logs .log-error {
            color: #ff4444;
        }

        .debug-logs .log-success {
            color: #44ff44;
        }

        .debug-logs .log-info {
            color: #4444ff;
        }

        /* Toggle button for debug logs */
        .debug-toggle {
            position: fixed;
            top: 10px;
            right: 10px;
            background: #00ff00;
            color: #000;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            z-index: 10001;
        }

        .debug-toggle:hover {
            background: #00cc00;
        }

        /* Botões na parte inferior da tela */
        .bottom-controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 1000;
        }

        .bottom-btn {
            background: rgba(0,0,0,0.8);
            color: white;
            border: 2px solid rgba(255,255,255,0.3);
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            min-width: 100px;
        }

        .bottom-btn:hover {
            background: rgba(255,255,255,0.9);
            color: #000;
            border-color: rgba(255,255,255,0.9);
            transform: translateY(-2px);
        }

        .bottom-btn.assistir {
            background: rgba(255,0,0,0.8);
            border-color: rgba(255,0,0,0.8);
        }

        .bottom-btn.assistir:hover {
            background: rgba(255,0,0,1);
            border-color: rgba(255,0,0,1);
            color: white;
        }

        /* Janela PIP integrada */
        .pip-window {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 300px;
            height: 200px;
            background: #000;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            z-index: 5000;
            overflow: hidden;
            border: 2px solid #333;
        }

        .pip-window iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 8px;
        }

        .pip-controls {
            position: absolute;
            top: 5px;
            right: 5px;
            display: flex;
            gap: 5px;
            z-index: 5001;
        }

        .pip-btn {
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pip-btn:hover {
            background: rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Banner simples 320x100 -->
        <div class="banner-ad">
            320x100
        </div>

        <!-- Container do jogo - ocupa o resto da tela -->
        <div class="game-container" id="gameContainer">
            <div id="loadingScreen" class="loading-screen">
                <div class="loading-spinner"></div>
                <div class="loading-text">Carregando Jogo...</div>
                <div class="loading-subtext" id="loadingSubtext">Aguarde um momento</div>
                <div class="loading-actions" id="loadingActions" style="display: none;">
                    <button class="loading-btn" onclick="forceFallback()">🚀 Pular para Gamezop</button>
                    <button class="loading-btn" onclick="goBack()">← Voltar</button>
                </div>
            </div>
            
            
            <iframe id="gameFrame" class="game-iframe" src="" style="display: none;"></iframe>
        </div>
    </div>

    <!-- Overlay para fechar o drawer -->
    <div class="nav-overlay" id="navOverlay" onclick="handleOverlayClick(event)"></div>

    <!-- Navigation Drawer lateral estilo Apple -->
    <div class="nav-drawer">
        <button class="nav-toggle" id="navToggle" onclick="addDebugLog('🔍 Botão toggle clicado', 'info'); toggleNav();"></button>
    </div>

    <!-- Menu lateral que desliza -->
    <div class="nav-menu" id="navMenu">
        <div class="nav-carousel">
            <div class="nav-item" id="assistirBtn" onclick="showWatchDialog()">
                <span class="nav-item-icon">👁️</span>
                Assistir
            </div>
            <div class="nav-item" onclick="restartGame()">
                <span class="nav-item-icon">🔄</span>
                Reiniciar
            </div>
            <div class="nav-item" onclick="goBack()">
                <span class="nav-item-icon">🚪</span>
                Sair
            </div>
        </div>
    </div>

    <!-- Debug Logs Area -->
    <div class="debug-logs" id="debugLogs">
        <div style="color: #00ff00; font-weight: bold; margin-bottom: 10px; text-align: center;">
            🔍 DEBUG LOGS
        </div>
        <div id="logEntries"></div>
    </div>

    <!-- Debug Toggle Button -->
    <button class="debug-toggle" id="debugToggle" onclick="toggleDebugLogs()">
        DEBUG
    </button>

    <!-- Botões na parte inferior da tela -->
    <div class="bottom-controls">
        <button class="bottom-btn assistir" onclick="addDebugLog('🔍 Botão Assistir clicado (inferior)', 'success'); openYouTubePIP();">
            📺 Assistir
        </button>
        <button class="bottom-btn" onclick="addDebugLog('🔍 Botão Sair clicado (inferior)', 'info'); goBack();">
            🚪 Sair
        </button>
    </div>

    <!-- Janela PIP integrada (inicialmente oculta) -->
    <div class="pip-window" id="pipWindow" style="display: none;">
        <div class="pip-controls">
            <button class="pip-btn" onclick="minimizePipWindow()" title="Minimizar">−</button>
            <button class="pip-btn" onclick="closePipWindow()" title="Fechar">×</button>
        </div>
        <iframe id="pipIframe" src="" frameborder="0" allowfullscreen></iframe>
    </div>

    <script>
        // Sistema de Logs Visuais
        function addDebugLog(message, type = 'info') {
            const logEntries = document.getElementById('logEntries');
            const time = new Date().toLocaleTimeString();
            
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry log-${type}`;
            logEntry.innerHTML = `
                <span class="log-time">[${time}]</span> ${message}
            `;
            
            logEntries.appendChild(logEntry);
            
            // Auto-scroll para o último log
            logEntries.scrollTop = logEntries.scrollHeight;
            
            // Limita a 50 logs para não sobrecarregar
            const entries = logEntries.children;
            if (entries.length > 50) {
                entries[0].remove();
            }
            
            // Também loga no console
            console.log(message);
        }

        function toggleDebugLogs() {
            const debugLogs = document.getElementById('debugLogs');
            const debugToggle = document.getElementById('debugToggle');
            
            if (debugLogs.classList.contains('show')) {
                debugLogs.classList.remove('show');
                debugToggle.textContent = 'DEBUG';
                debugToggle.style.background = '#00ff00';
            } else {
                debugLogs.classList.add('show');
                debugToggle.textContent = 'HIDE';
                debugToggle.style.background = '#ff0000';
            }
        }

        function clearDebugLogs() {
            document.getElementById('logEntries').innerHTML = '';
        }

        // Função para obter parâmetros da URL
        function getUrlParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        // Função para voltar
        function goBack() {
            const returnUrl = getUrlParameter('return') || 'index.html';
            window.location.href = returnUrl;
        }

        // Variáveis globais para o jogo
        let currentGameUrl = '';
        let currentGameTitle = '';

        // Variáveis para controle de retry
        let retryCount = 0;
        const maxRetries = 3;
        let gameLoadTimeout = null;

        // Carrega o jogo baseado nos parâmetros da URL
        function loadGame() {
            const gameUrl = getUrlParameter('url');
            const gameTitle = getUrlParameter('title') || 'Jogo';
            const gameOrientation = getUrlParameter('orientation') || 'vertical';
            
            if (!gameUrl) {
                alert('URL do jogo não encontrada!');
                goBack();
                return;
            }

            // Armazena informações do jogo
            currentGameUrl = gameUrl;
            currentGameTitle = gameTitle;

            // Atualiza o título da página
            document.getElementById('pageTitle').textContent = gameTitle + ' - Portal de Jogos';
            document.getElementById('loadingSubtext').textContent = gameTitle;
            
            // Ajusta o container baseado na orientação
            const gameContainer = document.getElementById('gameContainer');
            const gameFrame = document.getElementById('gameFrame');
            
            if (gameOrientation === 'horizontal') {
                gameContainer.classList.add('horizontal');
                gameFrame.classList.add('horizontal');
            }
            
            // Verifica se é um jogo externo - tenta incorporar primeiro
            if (gameUrl.includes('gamezop.com') || gameUrl.includes('famobi.com')) {
                addDebugLog('🎮 Jogo externo detectado - Tentando incorporação', 'info');
                addDebugLog('🔧 Tentando diferentes métodos de incorporação...', 'info');
                
                // Atualiza texto de loading
                document.getElementById('loadingSubtext').textContent = 'Tentando incorporar jogo externo...';
                
                // Tenta incorporar o jogo primeiro
                tryEmbedExternalGame(gameUrl, gameFrame);
            } else {
                // Para outros jogos, carrega normalmente
                loadGameWithRetry(gameUrl, gameFrame);
            }
        }

        // Função para tentar incorporar jogos externos
        function tryEmbedExternalGame(gameUrl, gameFrame) {
            addDebugLog('🔧 Iniciando tentativas de incorporação de jogo externo', 'info');
            
            const methods = [
                {
                    name: 'Método 1: Iframe Direto',
                    setup: () => {
                        gameFrame.src = gameUrl;
                        gameFrame.removeAttribute('sandbox');
                        gameFrame.removeAttribute('referrerpolicy');
                    }
                },
                {
                    name: 'Método 2: Iframe com Sandbox',
                    setup: () => {
                        gameFrame.src = gameUrl;
                        gameFrame.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups allow-presentation');
                    }
                },
                {
                    name: 'Método 3: Iframe com No-Referrer',
                    setup: () => {
                        gameFrame.src = gameUrl;
                        gameFrame.setAttribute('referrerpolicy', 'no-referrer');
                        gameFrame.removeAttribute('sandbox');
                    }
                },
                {
                    name: 'Método 4: Proxy Local via Data URI',
                    setup: () => {
                        const proxyHtml = `
                            <!DOCTYPE html>
                            <html>
                            <head>
                                <meta charset="UTF-8">
                                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                                <title>Proxy Local</title>
                                <style>
                                    body { margin: 0; padding: 0; background: #000; overflow: hidden; }
                                    iframe { width: 100%; height: 100vh; border: none; }
                                </style>
                            </head>
                            <body>
                                <iframe src="${gameUrl}" allowfullscreen></iframe>
                            </body>
                            </html>
                        `;
                        const blob = new Blob([proxyHtml], { type: 'text/html' });
                        const url = URL.createObjectURL(blob);
                        gameFrame.src = url;
                    }
                },
                {
                    name: 'Método 5: Iframe com Headers Customizados',
                    setup: () => {
                        gameFrame.src = gameUrl + (gameUrl.includes('?') ? '&' : '?') + 'x-frame-options=allow&csp=bypass';
                    }
                }
            ];
            
            let currentMethod = 0;
            let success = false;
            
            function tryNextMethod() {
                if (currentMethod >= methods.length) {
                    addDebugLog('❌ Todos os métodos de incorporação falharam', 'error');
                    addDebugLog('🌐 Abrindo jogo em nova aba como fallback', 'info');
                    openGameInNewTab();
                    return;
                }
                
                const method = methods[currentMethod];
                addDebugLog(`🔧 ${method.name}`, 'info');
                document.getElementById('loadingSubtext').textContent = method.name;
                
                // Configura o iframe
                method.setup();
                
                // Monitora o carregamento
                const timeout = setTimeout(() => {
                    if (!success) {
                        addDebugLog(`⏰ Timeout no ${method.name}`, 'warning');
                        currentMethod++;
                        tryNextMethod();
                    }
                }, 3000);
                
                gameFrame.onload = function() {
                    clearTimeout(timeout);
                    success = true;
                    addDebugLog(`✅ ${method.name} funcionou!`, 'success');
                    document.getElementById('loadingScreen').style.display = 'none';
                    gameFrame.style.display = 'block';
                };
                
                gameFrame.onerror = function() {
                    clearTimeout(timeout);
                    addDebugLog(`❌ ${method.name} falhou`, 'error');
                    currentMethod++;
                    tryNextMethod();
                };
            }
            
            // Inicia as tentativas
            tryNextMethod();
        }

        // Função para carregar jogo com sistema de retry
        function loadGameWithRetry(gameUrl, gameFrame) {
            addDebugLog(`🔄 Tentativa ${retryCount + 1}/${maxRetries} de carregar: ${currentGameTitle}`, 'info');
            
            // Limpa timeout anterior se existir
            if (gameLoadTimeout) {
                clearTimeout(gameLoadTimeout);
            }
            
            // Define timeout baseado no tipo de jogo
            const timeoutDuration = gameUrl.includes('gamezop.com') ? 4000 : 3000;
            
            // Carrega o iframe
            gameFrame.src = gameUrl;
            addDebugLog(`🌐 Carregando URL: ${gameUrl}`, 'info');
            
            // Timeout para verificar se carregou
            gameLoadTimeout = setTimeout(() => {
                addDebugLog(`⏰ Timeout atingido após ${timeoutDuration}ms - iframe não carregou`, 'error');
                handleGameLoadFailure(gameUrl, gameFrame);
            }, timeoutDuration);
            
            // Mostra botões de ação após 3 segundos
            setTimeout(() => {
                if (gameFrame.style.display === 'none') {
                    addDebugLog(`⏰ Mostrando botões de ação após 3s`, 'info');
                    document.getElementById('loadingActions').style.display = 'flex';
                }
            }, 3000);
            
            // Verificação adicional para jogos Gamezop - se não carregar em 2 segundos, já tenta fallback
            if (gameUrl.includes('gamezop.com')) {
                setTimeout(() => {
                    if (gameFrame.style.display === 'none') {
                        addDebugLog(`⚠️ Gamezop não carregou em 2s - pode ser bloqueio CSP`, 'error');
                        // Para Gamezop, se não carregar rapidamente, já ativa fallback
                        if (retryCount === 0) {
                            addDebugLog(`🚀 Gamezop: Ativando fallback imediato`, 'info');
                            clearTimeout(gameLoadTimeout);
                            showGamezopFallback(gameUrl);
                        }
                    }
                }, 2000);
            }
            
            // Listener para sucesso no carregamento
            gameFrame.onload = function() {
                addDebugLog(`✅ Evento onload disparado na tentativa ${retryCount + 1}`, 'info');
                clearTimeout(gameLoadTimeout);
                
                // Para jogos do Gamezop, verifica se realmente carregou
                if (gameUrl.includes('gamezop.com')) {
                    // Aguarda um pouco mais para verificar se não há erro de CSP
                    setTimeout(() => {
                        try {
                            // Tenta acessar o conteúdo do iframe para verificar se carregou
                            const iframeDoc = gameFrame.contentDocument || gameFrame.contentWindow.document;
                            if (iframeDoc && iframeDoc.body && iframeDoc.body.innerHTML.trim() !== '') {
                                addDebugLog('✅ Jogo Gamezop carregado e funcionando', 'success');
                                document.getElementById('loadingScreen').style.display = 'none';
                                gameFrame.style.display = 'block';
                                retryCount = 0;
                            } else {
                                addDebugLog('⚠️ Jogo Gamezop carregou mas conteúdo vazio', 'error');
                                handleGameLoadFailure(gameUrl, gameFrame);
                            }
                        } catch (e) {
                            // Se não conseguir acessar o conteúdo, assume que carregou
                            addDebugLog('✅ Jogo Gamezop carregado (acesso ao conteúdo bloqueado)', 'success');
                            document.getElementById('loadingScreen').style.display = 'none';
                            gameFrame.style.display = 'block';
                            retryCount = 0;
                        }
                    }, 1000);
                } else {
                    // Para outros jogos, comportamento normal
                    addDebugLog('✅ Jogo carregado com sucesso', 'success');
                    document.getElementById('loadingScreen').style.display = 'none';
                    gameFrame.style.display = 'block';
                    retryCount = 0;
                }
            };
            
            // Listener para erro no carregamento
            gameFrame.onerror = function() {
                addDebugLog(`❌ Erro no carregamento do iframe na tentativa ${retryCount + 1}`, 'error');

                if (currentMethod >= methods.length) {

                }
                
                // Tenta carregar
                gameFrame.src = method.url;
                
                // Timeout para este método
                const methodTimeout = setTimeout(() => {
                    addDebugLog(`⏰ ${method.name} falhou`, 'error');
                    currentMethod++;
                    tryNextMethod();

                    currentMethod++;

                };

        // Função para tornar a PIP arrastável
        function makePipDraggable(element) {
            let isDragging = false;
            let startX, startY, initialX, initialY;
            
            // Adicionar cursor de movimento ao header
            const header = element.querySelector('#pipHeader');
            if (header) {
                header.style.cursor = 'move';
                header.style.userSelect = 'none';
            }

            function getMousePos(e) {
                return {
                    x: e.clientX || (e.touches && e.touches[0].clientX),
                    y: e.clientY || (e.touches && e.touches[0].clientY)
                };
            }

            function startDrag(e) {
                // Só permite arrastar pelo header
                if (!header || !header.contains(e.target)) return;
                
                isDragging = true;
                const pos = getMousePos(e);
                startX = pos.x;
                startY = pos.y;
                
                // Obter posição atual do elemento
                const rect = element.getBoundingClientRect();
                initialX = rect.left;
                initialY = rect.top;
                
                e.preventDefault();
                addDebugLog('🔍 Iniciando arrastar PIP', 'info');
            }

            function drag(e) {
                if (!isDragging) return;
                
                e.preventDefault();
                const pos = getMousePos(e);
                
                const deltaX = pos.x - startX;
                const deltaY = pos.y - startY;
                
                const newX = initialX + deltaX;
                const newY = initialY + deltaY;
                
                // Limitar aos limites da tela
                const maxX = window.innerWidth - element.offsetWidth;
                const maxY = window.innerHeight - element.offsetHeight;
                
                const clampedX = Math.max(0, Math.min(newX, maxX));
                const clampedY = Math.max(0, Math.min(newY, maxY));
                
                element.style.left = clampedX + 'px';
                element.style.top = clampedY + 'px';
                element.style.right = 'auto';
                element.style.transform = 'none';
            }

            function endDrag(e) {
                if (isDragging) {
                    isDragging = false;
                    addDebugLog('🔍 Parando de arrastar PIP', 'info');
                }
            }

            // Event listeners
            element.addEventListener('mousedown', startDrag);
            element.addEventListener('touchstart', startDrag);
            
            document.addEventListener('mousemove', drag);
            document.addEventListener('touchmove', drag);
            
            document.addEventListener('mouseup', endDrag);
            document.addEventListener('touchend', endDrag);
            
            // Prevenir seleção de texto durante o arrastar
            element.addEventListener('selectstart', (e) => e.preventDefault());
        }

        // Função para tornar a PIP global arrastável
        function makeGlobalPipDraggable(element) {
            let isDragging = false;
            let currentX;
            let currentY;
            let initialX;
            let initialY;
            let xOffset = 0;
            let yOffset = 0;

            element.addEventListener('mousedown', dragStart);
            document.addEventListener('mousemove', drag);
            document.addEventListener('mouseup', dragEnd);

            function dragStart(e) {
                if (e.target.tagName === 'BUTTON' || e.target.tagName === 'IFRAME') {
                    return;
                }
                
                initialX = e.clientX - xOffset;
                initialY = e.clientY - yOffset;

                if (e.target === element || element.contains(e.target)) {
                    isDragging = true;
                    element.style.cursor = 'grabbing';
                }
            }

            function drag(e) {
                if (isDragging) {
                    e.preventDefault();
                    currentX = e.clientX - initialX;
                    currentY = e.clientY - initialY;

                    xOffset = currentX;
                    yOffset = currentY;

                    element.style.transform = `translate(${currentX}px, ${currentY}px)`;
                }
            }

            function dragEnd(e) {
                initialX = currentX;
                initialY = currentY;
                isDragging = false;
                element.style.cursor = 'move';
            }
        }

        function makeDraggable(element) {
            let isDragging = false;
            let currentX;
            let currentY;
            let initialX;
            let initialY;
            let xOffset = 0;
            let yOffset = 0;

            element.addEventListener('mousedown', dragStart);
            document.addEventListener('mousemove', drag);
            document.addEventListener('mouseup', dragEnd);

            function dragStart(e) {
                if (e.target.tagName === 'BUTTON') return; // Não arrastar se clicar em botão
                
                initialX = e.clientX - xOffset;
                initialY = e.clientY - yOffset;

                if (e.target === element || element.contains(e.target)) {
                    isDragging = true;
                    element.style.cursor = 'grabbing';
                }
            }

            function drag(e) {
                if (isDragging) {
                    e.preventDefault();
                    currentX = e.clientX - initialX;
                    currentY = e.clientY - initialY;

                    xOffset = currentX;
                    yOffset = currentY;

                    element.style.transform = `translate(${currentX}px, ${currentY}px)`;
                }
            }

            function dragEnd(e) {
                initialX = currentX;
                initialY = currentY;
                isDragging = false;
                element.style.cursor = 'move';
            }
        }
