<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Jogo Vertical - Portal de Jogos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #000;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            margin: 0;
            padding: 0;
        }

        /* BANNER SIMPLES 320x100 - Apenas texto preto */
        .banner-ad {
            width: 100%;
            max-width: 320px;
            height: 100px;
            margin: 0 auto;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        /* Container do jogo - ocupa o resto da tela */
        .game-container {
            width: 100%;
            height: calc(100vh - 100px);
            margin: 0;
            padding: 0;
            background: #000;
        }

        .game-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        /* Estilos específicos para jogos horizontais */
        .game-iframe.horizontal {
            height: 100%;
        }

        /* Container adaptável para orientação */
        .game-container.horizontal {
            height: calc(100vh - 100px);
        }

        /* Navigation Drawer lateral estilo Apple */
        .nav-drawer {
            position: fixed;
            bottom: 80px;
            right: 0;
            z-index: 1000;
        }

        .nav-toggle {
            width: 40px;
            height: 80px;
            background: rgba(255,255,255,0.9);
            border: none;
            border-radius: 20px 0 0 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: -2px 0 8px rgba(0,0,0,0.15);
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .nav-toggle:hover {
            background: rgba(255,255,255,1);
            transform: translateX(-5px);
            box-shadow: -4px 0 12px rgba(0,0,0,0.2);
        }

        .nav-toggle.active {
            background: rgba(0,0,0,0.8);
        }

        /* Barrinha arredondada */
        .nav-toggle::before {
            content: '';
            width: 20px;
            height: 3px;
            background: #000;
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .nav-toggle.active::before {
            background: white;
        }

        .nav-menu {
            position: fixed;
            top: 0;
            right: -300px;
            width: 300px;
            height: 100vh;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(20px);
            transition: all 0.3s ease;
            padding: 60px 20px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-left: 1px solid rgba(255,255,255,0.1);
        }

        .nav-menu.active {
            right: 0;
        }

        /* Carrossel de opções */
        .nav-carousel {
            display: flex;
            flex-direction: column;
            gap: 40px;
            align-items: center;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: white;
            text-decoration: none;
            border-radius: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            min-width: 120px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .nav-item:hover {
            background: rgba(255,255,255,0.1);
            transform: scale(1.05);
            border-color: rgba(255,255,255,0.2);
        }

        .nav-item:active {
            background: rgba(255,255,255,0.15);
            transform: scale(0.95);
        }

        .nav-item-icon {
            font-size: 32px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }

        .nav-item:hover .nav-item-icon {
            transform: scale(1.1);
        }

        /* Overlay para fechar o drawer */
        .nav-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.3);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 999;
        }

        .nav-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            background: #000;
            color: white;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .loading-subtext {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        /* Aviso de erro */
        .error-message {
            background: #333;
            border: 1px solid #666;
            border-radius: 8px;
            padding: 15px;
            margin: 15px;
            color: white;
            text-align: center;
        }

        .error-message h4 {
            margin-bottom: 10px;
        }

        .error-message p {
            margin-bottom: 10px;
        }

        .error-message button {
            background: #666;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            margin: 0 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Banner simples 320x100 -->
        <div class="banner-ad">
            320x100
        </div>

        <!-- Container do jogo - ocupa o resto da tela -->
        <div class="game-container" id="gameContainer">
            <div id="loadingScreen" class="loading-screen">
                <div class="loading-spinner"></div>
                <div class="loading-text">Carregando Jogo...</div>
                <div class="loading-subtext" id="loadingSubtext">Aguarde um momento</div>
            </div>
            
            <div id="errorMessage" class="error-message" style="display: none;">
                <h4>⚠️ Erro ao Carregar o Jogo</h4>
                <p>O jogo não pôde ser carregado devido a restrições de segurança.</p>
                <p>Isso é comum com jogos do Gamezop que não permitem iframes.</p>
                <button onclick="openOriginal()">🌐 Abrir Jogo Original</button>
                <button onclick="goBack()">← Voltar</button>
            </div>
            
            <iframe id="gameFrame" class="game-iframe" src="" style="display: none;"></iframe>
        </div>
    </div>

    <!-- Overlay para fechar o drawer -->
    <div class="nav-overlay" id="navOverlay" onclick="closeNav()"></div>

    <!-- Navigation Drawer lateral estilo Apple -->
    <div class="nav-drawer">
        <button class="nav-toggle" id="navToggle" onclick="toggleNav()"></button>
    </div>

    <!-- Menu lateral que desliza -->
    <div class="nav-menu" id="navMenu">
        <div class="nav-carousel">
            <div class="nav-item" onclick="watchGame()">
                <span class="nav-item-icon">👁️</span>
                Assistir
            </div>
            <div class="nav-item" onclick="restartGame()">
                <span class="nav-item-icon">🔄</span>
                Reiniciar
            </div>
            <div class="nav-item" onclick="goBack()">
                <span class="nav-item-icon">🚪</span>
                Sair
            </div>
        </div>
    </div>

    <script>
        // Função para obter parâmetros da URL
        function getUrlParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        // Função para voltar
        function goBack() {
            const returnUrl = getUrlParameter('return') || 'index.html';
            window.location.href = returnUrl;
        }

        // Variáveis globais para o jogo
        let currentGameUrl = '';
        let currentGameTitle = '';

        // Carrega o jogo baseado nos parâmetros da URL
        function loadGame() {
            const gameUrl = getUrlParameter('url');
            const gameTitle = getUrlParameter('title') || 'Jogo';
            const gameOrientation = getUrlParameter('orientation') || 'vertical';
            
            if (!gameUrl) {
                alert('URL do jogo não encontrada!');
                goBack();
                return;
            }

            // Armazena informações do jogo
            currentGameUrl = gameUrl;
            currentGameTitle = gameTitle;

            // Atualiza o título da página
            document.getElementById('pageTitle').textContent = gameTitle + ' - Portal de Jogos';
            document.getElementById('loadingSubtext').textContent = gameTitle;
            
            // Ajusta o container baseado na orientação
            const gameContainer = document.getElementById('gameContainer');
            const gameFrame = document.getElementById('gameFrame');
            
            if (gameOrientation === 'horizontal') {
                gameContainer.classList.add('horizontal');
                gameFrame.classList.add('horizontal');
            }
            
            // Carrega o iframe do jogo
            gameFrame.src = gameUrl;
            
            // Verifica se é um jogo do Gamezop (que pode ter problemas de CSP)
            if (gameUrl.includes('gamezop.com')) {
                // Para jogos do Gamezop, mostra erro após 3 segundos se não carregar
                setTimeout(function() {
                    if (gameFrame.style.display === 'none') {
                        showErrorMessage();
                    }
                }, 3000);
            } else {
                // Para jogos locais, comportamento normal
                setTimeout(function() {
                    document.getElementById('loadingScreen').style.display = 'none';
                    gameFrame.style.display = 'block';
                }, 2000);
            }
        }

        function showErrorMessage() {
            document.getElementById('loadingScreen').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'block';
        }

        function openOriginal() {
            if (currentGameUrl) {
                window.open(currentGameUrl, '_blank');
            }
        }

        // Funções do Navigation Drawer lateral
        function toggleNav() {
            const navToggle = document.getElementById('navToggle');
            const navMenu = document.getElementById('navMenu');
            const navOverlay = document.getElementById('navOverlay');
            
            navToggle.classList.toggle('active');
            navMenu.classList.toggle('active');
            navOverlay.classList.toggle('active');
        }

        function closeNav() {
            const navToggle = document.getElementById('navToggle');
            const navMenu = document.getElementById('navMenu');
            const navOverlay = document.getElementById('navOverlay');
            
            navToggle.classList.remove('active');
            navMenu.classList.remove('active');
            navOverlay.classList.remove('active');
        }

        function watchGame() {
            // Função para assistir o jogo (pode ser expandida futuramente)
            alert('Funcionalidade "Assistir" será implementada em breve!');
            closeNav(); // Fecha o drawer
        }

        function restartGame() {
            // Função para reiniciar o jogo
            const gameFrame = document.getElementById('gameFrame');
            if (gameFrame && gameFrame.src) {
                // Recarrega o iframe do jogo
                gameFrame.src = gameFrame.src;
                closeNav(); // Fecha o drawer
            } else {
                alert('Nenhum jogo carregado para reiniciar!');
                closeNav();
            }
        }

        // Event listener para detectar quando o iframe carrega com sucesso
        document.getElementById('gameFrame').addEventListener('load', function() {
            document.getElementById('loadingScreen').style.display = 'none';
            this.style.display = 'block';
            document.getElementById('gameControls').style.display = 'flex';
        });

        // Event listener para detectar erros no iframe
        document.getElementById('gameFrame').addEventListener('error', function() {
            showErrorMessage();
        });

        // Carrega o jogo quando a página é carregada
        document.addEventListener('DOMContentLoaded', loadGame);
    </script>
</body>
</html>
