<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista Completa de Jogos - Portal de Jogos</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7154773731438541"
     crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/gdpr-consent.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #ff6b6b 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .controls {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            color: white;
            backdrop-filter: blur(10px);
        }

        .search-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 250px;
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            background: rgba(255,255,255,0.9);
            color: #333;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .filter-btn.active {
            background: rgba(255,255,255,0.3);
            transform: scale(1.05);
        }

        .filter-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            color: white;
            backdrop-filter: blur(10px);
        }

        .stat-card h3 {
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .stat-card p {
            opacity: 0.9;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .game-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .game-card h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.3rem;
        }

        .game-card p {
            color: #666;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .play-button {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .play-button:hover {
            background: linear-gradient(45deg, #764ba2, #667eea);
            transform: scale(1.05);
        }

        .orientation-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .orientation-badge.vertical {
            background: #4ecdc4;
            color: white;
        }

        .orientation-badge.horizontal {
            background: #ff6b6b;
            color: white;
        }

        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .back-button:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.05);
        }

        .no-results {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            margin-top: 50px;
        }

        @media (max-width: 768px) {
            .search-container {
                flex-direction: column;
            }
            
            .games-grid {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <button class="back-button" onclick="goBack()">← Voltar</button>
    
    <div class="container">
        <div class="header">
            <h1>🎮 Lista Completa de Jogos</h1>
            <p>Explore todos os jogos disponíveis no portal</p>
        </div>

        <div class="controls">
            <div class="search-container">
                <input type="text" class="search-input" id="searchInput" placeholder="🔍 Pesquisar jogos...">
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">Todos</button>
                    <button class="filter-btn" data-filter="vertical">📱 Verticais</button>
                    <button class="filter-btn" data-filter="horizontal">🖥️ Horizontais</button>
                </div>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <h3 id="totalGames">0</h3>
                <p>Total de Jogos</p>
            </div>
            <div class="stat-card">
                <h3 id="verticalGames">0</h3>
                <p>Jogos Verticais</p>
            </div>
            <div class="stat-card">
                <h3 id="horizontalGames">0</h3>
                <p>Jogos Horizontais</p>
            </div>
        </div>

        <div class="games-grid" id="gamesGrid">
            <!-- Jogos serão carregados aqui via JavaScript -->
        </div>

        <div class="no-results" id="noResults" style="display: none;">
            <h3>😔 Nenhum jogo encontrado</h3>
            <p>Tente ajustar os filtros ou termo de pesquisa</p>
        </div>
    </div>

    <script src="js/games-config.js"></script>
    <script>
        let allGames = [];
        let filteredGames = [];

        function loadAllGames() {
            console.log('🎮 Carregando jogos...');
            console.log('📋 Array games:', typeof games, games ? games.length : 'undefined');
            
            if (typeof games === 'undefined' || !games || games.length === 0) {
                console.error('❌ Erro: Array games não foi carregado!');
                document.getElementById('gamesGrid').innerHTML = '<p style="color: red; text-align: center; padding: 20px;">❌ Erro: Não foi possível carregar os jogos!</p>';
                return;
            }
            
            allGames = games; // Usa o array games do games-config.js
            filteredGames = [...allGames];
            
            console.log('✅ Jogos carregados com sucesso! Total:', allGames.length);
            
            updateStats();
            renderGames();
            setupEventListeners();
        }

        function updateStats() {
            const verticalGames = allGames.filter(game => game.orientation === 'vertical');
            const horizontalGames = allGames.filter(game => game.orientation === 'horizontal');
            
            document.getElementById('totalGames').textContent = allGames.length;
            document.getElementById('verticalGames').textContent = verticalGames.length;
            document.getElementById('horizontalGames').textContent = horizontalGames.length;
        }

        function renderGames() {
            const gamesGrid = document.getElementById('gamesGrid');
            const noResults = document.getElementById('noResults');
            
            if (filteredGames.length === 0) {
                gamesGrid.innerHTML = '';
                noResults.style.display = 'block';
                return;
            }
            
            noResults.style.display = 'none';
            gamesGrid.innerHTML = '';
            
            filteredGames.forEach(game => {
                const gameCard = document.createElement('div');
                gameCard.className = 'game-card';
                gameCard.innerHTML = `
                    <div class="orientation-badge ${game.orientation}">
                        ${game.orientation === 'vertical' ? '📱 Vertical' : '🖥️ Horizontal'}
                    </div>
                    <h3>${game.title}</h3>
                    <p>${game.description}</p>
                    <button class="play-button" onclick="playGame('${game.id}')">
                        ▶️ Jogar Agora
                    </button>
                `;
                
                gamesGrid.appendChild(gameCard);
            });
        }

        function filterGames(filter) {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            if (filter === 'all') {
                filteredGames = allGames.filter(game => 
                    game.title.toLowerCase().includes(searchTerm) ||
                    game.description.toLowerCase().includes(searchTerm) ||
                    game.tags.some(tag => tag.toLowerCase().includes(searchTerm))
                );
            } else if (filter === 'vertical') {
                filteredGames = allGames.filter(game => 
                    game.orientation === 'vertical' && (
                        game.title.toLowerCase().includes(searchTerm) ||
                        game.description.toLowerCase().includes(searchTerm) ||
                        game.tags.some(tag => tag.toLowerCase().includes(searchTerm))
                    )
                );
            } else if (filter === 'horizontal') {
                filteredGames = allGames.filter(game => 
                    game.orientation === 'horizontal' && (
                        game.title.toLowerCase().includes(searchTerm) ||
                        game.description.toLowerCase().includes(searchTerm) ||
                        game.tags.some(tag => tag.toLowerCase().includes(searchTerm))
                    )
                );
            }
            
            renderGames();
        }

        function setupEventListeners() {
            // Filtros
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    filterGames(e.target.dataset.filter);
                });
            });

            // Pesquisa
            document.getElementById('searchInput').addEventListener('input', (e) => {
                const activeFilter = document.querySelector('.filter-btn.active').dataset.filter;
                filterGames(activeFilter);
            });
        }

        // A função playGame agora usa diretamente a função global do games-config.js
        // Não precisa redefinir aqui, pois já está disponível globalmente

        function goBack() {
            window.location.href = 'index.html';
        }

        // Carrega os jogos quando a página é carregada
        document.addEventListener('DOMContentLoaded', loadAllGames);
    </script>
    <script src="js/google-cmp.js"></script>
</body>
</html>
