<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Among Us - Jogar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .ad-container {
            width: 100%;
            height: 100px;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid #ddd;
            position: relative;
        }

        .ad-placeholder {
            width: 320px;
            height: 100px;
            background: linear-gradient(135deg, #FF6B6B, #C44569);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 16px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .game-container {
            flex: 1;
            position: relative;
            background: #000;
        }

        .game-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .game-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .game-title {
            font-size: 18px;
            font-weight: 600;
        }

        .back-button {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .back-button:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.05);
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            z-index: 999;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            z-index: 999;
            background: rgba(0,0,0,0.8);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .error-message h3 {
            font-size: 24px;
            margin-bottom: 15px;
            color: #FF6B6B;
        }

        .error-message p {
            font-size: 16px;
            margin-bottom: 20px;
            opacity: 0.9;
        }

        .retry-button {
            background: linear-gradient(135deg, #FF6B6B, #C44569);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 5px;
        }

        .retry-button:hover {
            transform: scale(1.05);
        }

        .proxy-status {
            position: absolute;
            top: 60px;
            right: 20px;
            background: rgba(0,255,0,0.2);
            color: #00ff00;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            z-index: 1001;
        }

        .server-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            border-radius: 10px;
            font-size: 12px;
            z-index: 1001;
        }

        /* Responsivo para mobile */
        @media (max-width: 480px) {
            .ad-container {
                height: 80px;
            }
            
            .ad-placeholder {
                width: 280px;
                height: 80px;
                font-size: 14px;
            }
            
            .game-header {
                padding: 12px 15px;
            }
            
            .game-title {
                font-size: 16px;
            }
            
            .back-button {
                padding: 6px 10px;
                font-size: 12px;
            }
            
            .server-info {
                bottom: 10px;
                left: 10px;
                font-size: 10px;
                padding: 8px;
            }
        }

        /* Para telas muito pequenas */
        @media (max-width: 360px) {
            .ad-placeholder {
                width: 240px;
                height: 70px;
                font-size: 12px;
            }
            
            .ad-container {
                height: 70px;
            }
        }
    </style>
</head>
<body>
    <!-- Área do anúncio -->
    <div class="ad-container">
        <div class="ad-placeholder">
            📢 Espaço para Anúncio<br>
            <small>320x100</small>
        </div>
    </div>

    <!-- Container do jogo -->
    <div class="game-container">
        <!-- Header do jogo -->
        <div class="game-header">
            <div class="game-title">🚀 Among Us - Proxy Local</div>
            <button class="back-button" onclick="goBack()">
                ← Voltar
            </button>
        </div>

        <!-- Status do proxy -->
        <div class="proxy-status" id="proxyStatus">
            🔄 Conectando...
        </div>

        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            Carregando via Proxy Local...
        </div>

        <!-- Iframe do jogo -->
        <iframe 
            class="game-iframe" 
            id="gameFrame"
            src=""
            allowfullscreen
            allow="autoplay; fullscreen; microphone; camera"
            onload="hideLoading()"
            onerror="handleIframeError()">
        </iframe>

        <!-- Info do servidor -->
        <div class="server-info">
            🖥️ Proxy Local: localhost:8001<br>
            🎮 Jogo: agame.com/among-us
        </div>
    </div>

    <script>
        let currentMethodIndex = 0;
        
        // URLs usando proxy local
        const proxyUrls = [
            'http://localhost:8001/proxy/www.agame.com/game/among-us',
            'http://localhost:8001/proxy/agame.com/game/among-us',
            'http://localhost:8001/proxy/https://www.agame.com/game/among-us'
        ];

        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'lista-jogos-vertical.html';
            }
        }

        function hideLoading() {
            const loading = document.getElementById('loading');
            const proxyStatus = document.getElementById('proxyStatus');
            
            if (loading) {
                loading.style.display = 'none';
            }
            
            if (proxyStatus) {
                proxyStatus.textContent = '✅ Proxy Local OK';
                proxyStatus.style.background = 'rgba(0,255,0,0.2)';
                proxyStatus.style.color = '#00ff00';
            }
        }

        function showError() {
            const loading = document.getElementById('loading');
            const proxyStatus = document.getElementById('proxyStatus');
            
            if (proxyStatus) {
                proxyStatus.textContent = '❌ Proxy Local Falhou';
                proxyStatus.style.background = 'rgba(255,0,0,0.2)';
                proxyStatus.style.color = '#ff0000';
            }
            
            if (loading) {
                loading.innerHTML = `
                    <div class="error-message">
                        <h3>🚀 Among Us - Proxy Local</h3>
                        <p>Não foi possível conectar ao proxy local.</p>
                        <p>Certifique-se de que o servidor proxy está rodando na porta 8001.</p>
                        <button class="retry-button" onclick="tryNextMethod()">
                            🔄 Tentar Outra URL
                        </button>
                        <button class="retry-button" onclick="openInNewTab()">
                            🎯 Jogar em Nova Aba
                        </button>
                        <button class="retry-button" onclick="startProxyServer()">
                            🚀 Iniciar Proxy
                        </button>
                    </div>
                `;
            }
        }

        function handleIframeError() {
            console.log('Erro no iframe, tentando próxima URL...');
            tryNextMethod();
        }

        function tryNextMethod() {
            currentMethodIndex++;
            const gameFrame = document.getElementById('gameFrame');
            const loading = document.getElementById('loading');
            const proxyStatus = document.getElementById('proxyStatus');
            
            if (currentMethodIndex < proxyUrls.length) {
                const url = proxyUrls[currentMethodIndex];
                
                if (loading) {
                    loading.innerHTML = `
                        <div class="spinner"></div>
                        Tentando URL ${currentMethodIndex + 1}...
                    `;
                }
                
                if (proxyStatus) {
                    proxyStatus.textContent = `🔄 URL ${currentMethodIndex + 1}`;
                    proxyStatus.style.background = 'rgba(255,255,0,0.2)';
                    proxyStatus.style.color = '#ffff00';
                }
                
                setTimeout(() => {
                    console.log('Tentando URL:', url);
                    gameFrame.src = url;
                }, 1000);
            } else {
                showError();
            }
        }

        function openInNewTab() {
            window.open('https://www.agame.com/game/among-us', '_blank');
        }

        function startProxyServer() {
            // Abre uma nova aba com instruções para iniciar o proxy
            window.open('proxy_server.py', '_blank');
        }

        // Testa se o proxy local está funcionando
        async function testProxyServer() {
            try {
                const response = await fetch('http://localhost:8001/', {
                    method: 'HEAD',
                    mode: 'no-cors'
                });
                return true;
            } catch (error) {
                console.log('Proxy local não está rodando');
                return false;
            }
        }

        // Inicia carregando o jogo
        async function startGame() {
            const gameFrame = document.getElementById('gameFrame');
            const proxyStatus = document.getElementById('proxyStatus');
            
            if (proxyStatus) {
                proxyStatus.textContent = '🔄 Testando Proxy Local...';
                proxyStatus.style.background = 'rgba(255,255,0,0.2)';
                proxyStatus.style.color = '#ffff00';
            }
            
            // Testa se o proxy está rodando
            const isProxyRunning = await testProxyServer();
            
            if (isProxyRunning) {
                // Tenta a primeira URL
                const firstUrl = proxyUrls[0];
                console.log('Proxy local OK, carregando:', firstUrl);
                gameFrame.src = firstUrl;
            } else {
                // Se não estiver rodando, mostra erro
                setTimeout(() => {
                    showError();
                }, 2000);
            }
        }

        // Inicia o jogo quando a página carrega
        window.addEventListener('load', startGame);

        // Esconde o loading após 10 segundos como fallback
        setTimeout(() => {
            const loading = document.getElementById('loading');
            if (loading && loading.style.display !== 'none') {
                showError();
            }
        }, 10000);

        // Adiciona suporte para teclas de navegação
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                goBack();
            }
        });

        // Previne zoom em dispositivos móveis
        document.addEventListener('gesturestart', function (e) {
            e.preventDefault();
        });

        // Otimizações para mobile
        if (window.innerWidth <= 768) {
            document.body.style.touchAction = 'manipulation';
        }

        // Monitora mudanças no iframe
        const gameFrame = document.getElementById('gameFrame');
        if (gameFrame) {
            gameFrame.addEventListener('load', function() {
                console.log('Iframe carregado com sucesso via proxy local');
                hideLoading();
            });
        }

        // Log de debug
        console.log('Among Us Local Server carregado');
        console.log('URLs do proxy:', proxyUrls);
    </script>
</body>
</html>
