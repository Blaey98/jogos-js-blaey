<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Among Us - Jogar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .ad-container {
            width: 100%;
            height: 100px;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid #ddd;
            position: relative;
        }

        .ad-placeholder {
            width: 320px;
            height: 100px;
            background: linear-gradient(135deg, #FF6B6B, #C44569);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 16px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .game-container {
            flex: 1;
            position: relative;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .game-content {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            max-width: 400px;
            width: 100%;
        }

        .game-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }

        .game-title {
            font-size: 28px;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 15px;
        }

        .game-description {
            font-size: 16px;
            color: #7f8c8d;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .play-button {
            background: linear-gradient(135deg, #FF6B6B, #C44569);
            color: white;
            border: none;
            padding: 18px 40px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(255,107,107,0.3);
            margin-bottom: 20px;
            width: 100%;
        }

        .play-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(255,107,107,0.4);
        }

        .play-button:active {
            transform: translateY(-1px);
        }

        .back-button {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            position: absolute;
            top: 20px;
            left: 20px;
            backdrop-filter: blur(10px);
        }

        .back-button:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.05);
        }

        .features {
            display: flex;
            justify-content: space-around;
            margin-top: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .feature {
            text-align: center;
            flex: 1;
            min-width: 80px;
        }

        .feature-icon {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .feature-text {
            font-size: 12px;
            color: #7f8c8d;
            font-weight: 500;
        }

        /* Responsivo para mobile */
        @media (max-width: 480px) {
            .ad-container {
                height: 80px;
            }
            
            .ad-placeholder {
                width: 280px;
                height: 80px;
                font-size: 14px;
            }
            
            .game-content {
                padding: 30px 20px;
                margin: 10px;
            }
            
            .game-icon {
                font-size: 60px;
            }
            
            .game-title {
                font-size: 24px;
            }
            
            .play-button {
                padding: 15px 30px;
                font-size: 16px;
            }
            
            .back-button {
                top: 15px;
                left: 15px;
                padding: 10px 15px;
                font-size: 12px;
            }
        }

        /* Para telas muito pequenas */
        @media (max-width: 360px) {
            .ad-placeholder {
                width: 240px;
                height: 70px;
                font-size: 12px;
            }
            
            .ad-container {
                height: 70px;
            }
            
            .game-content {
                padding: 25px 15px;
            }
        }
    </style>
</head>
<body>
    <!-- Área do anúncio -->
    <div class="ad-container">
        <div class="ad-placeholder">
            📢 Espaço para Anúncio<br>
            <small>320x100</small>
        </div>
    </div>

    <!-- Container do jogo -->
    <div class="game-container">
        <!-- Botão de voltar -->
        <button class="back-button" onclick="goBack()">
            ← Voltar
        </button>

        <!-- Conteúdo do jogo -->
        <div class="game-content">
            <div class="game-icon">🚀</div>
            <h1 class="game-title">Among Us Online</h1>
            <p class="game-description">
                Descubra o impostor entre os tripulantes! 
                Complete tarefas ou elimine todos para vencer.
            </p>
            
            <button class="play-button" onclick="playGame()">
                🎮 Jogar Among Us
            </button>
            
            <div class="features">
                <div class="feature">
                    <div class="feature-icon">👥</div>
                    <div class="feature-text">Multiplayer</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">🎯</div>
                    <div class="feature-text">Estratégia</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">⚡</div>
                    <div class="feature-text">Rápido</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function goBack() {
            // Tenta voltar para a página anterior
            if (window.history.length > 1) {
                window.history.back();
            } else {
                // Se não há histórico, vai para a lista de jogos
                window.location.href = 'lista-jogos-vertical.html';
            }
        }

        function playGame() {
            // Abre o jogo em nova aba
            window.open('https://pt.y8.com/games/among_us_single_player', '_blank');
        }

        // Adiciona suporte para teclas de navegação
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                goBack();
            }
            if (e.key === 'Enter' || e.key === ' ') {
                playGame();
            }
        });

        // Previne zoom em dispositivos móveis
        document.addEventListener('gesturestart', function (e) {
            e.preventDefault();
        });

        // Otimizações para mobile
        if (window.innerWidth <= 768) {
            document.body.style.touchAction = 'manipulation';
        }

        // Adiciona efeito de hover no botão
        const playButton = document.querySelector('.play-button');
        playButton.addEventListener('mouseenter', function() {
            this.style.background = 'linear-gradient(135deg, #C44569, #FF6B6B)';
        });
        
        playButton.addEventListener('mouseleave', function() {
            this.style.background = 'linear-gradient(135deg, #FF6B6B, #C44569)';
        });
    </script>
</body>
</html>
