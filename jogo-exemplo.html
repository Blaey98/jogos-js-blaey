<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo Exemplo - Jogar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .ad-container {
            width: 100%;
            height: 100px;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid #ddd;
            position: relative;
        }

        .ad-placeholder {
            width: 320px;
            height: 100px;
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 16px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .game-container {
            flex: 1;
            position: relative;
            background: #000;
        }

        .game-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .game-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .game-title {
            font-size: 18px;
            font-weight: 600;
        }

        .back-button {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .back-button:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.05);
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            z-index: 999;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsivo para mobile */
        @media (max-width: 480px) {
            .ad-container {
                height: 80px;
            }
            
            .ad-placeholder {
                width: 280px;
                height: 80px;
                font-size: 14px;
            }
            
            .game-header {
                padding: 12px 15px;
            }
            
            .game-title {
                font-size: 16px;
            }
            
            .back-button {
                padding: 6px 10px;
                font-size: 12px;
            }
        }

        /* Para telas muito pequenas */
        @media (max-width: 360px) {
            .ad-placeholder {
                width: 240px;
                height: 70px;
                font-size: 12px;
            }
            
            .ad-container {
                height: 70px;
            }
        }
    </style>
</head>
<body>
    <!-- Área do anúncio -->
    <div class="ad-container">
        <div class="ad-placeholder">
            📢 Espaço para Anúncio<br>
            <small>320x100</small>
        </div>
    </div>

    <!-- Container do jogo -->
    <div class="game-container">
        <!-- Header do jogo -->
        <div class="game-header">
            <div class="game-title">🎮 Jogo Exemplo</div>
            <button class="back-button" onclick="goBack()">
                ← Voltar
            </button>
        </div>

        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            Carregando jogo...
        </div>

        <!-- Iframe do jogo - Substitua pela URL do seu jogo -->
        <iframe 
            class="game-iframe" 
            id="gameFrame"
            src="https://pt.y8.com/games/blob_opera"
            allowfullscreen
            allow="autoplay; fullscreen; microphone; camera"
            onload="hideLoading()">
        </iframe>
    </div>

    <script>
        function goBack() {
            // Tenta voltar para a página anterior
            if (window.history.length > 1) {
                window.history.back();
            } else {
                // Se não há histórico, vai para a lista de jogos
                window.location.href = 'lista-jogos-vertical.html';
            }
        }

        function hideLoading() {
            const loading = document.getElementById('loading');
            if (loading) {
                loading.style.display = 'none';
            }
        }

        // Esconde o loading após 3 segundos como fallback
        setTimeout(hideLoading, 3000);

        // Adiciona suporte para teclas de navegação
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                goBack();
            }
        });

        // Previne zoom em dispositivos móveis
        document.addEventListener('gesturestart', function (e) {
            e.preventDefault();
        });

        // Otimizações para mobile
        if (window.innerWidth <= 768) {
            document.body.style.touchAction = 'manipulation';
        }
    </script>
</body>
</html>
